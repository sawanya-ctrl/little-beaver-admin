function PurchasesView({ students, purchases, setPurchases, attendance, setAttendance, usedUnitsByPurchase, remainingOf, studentName, setSelectedStudentId, setTab, subjects, setSubjects, setRegistrationFees }) {
  const [filter, setFilter] = useState("active");
  const [adding, setAdding] = useState(false);
  const [editingPurchase, setEditingPurchase] = useState(null);
  const sorted = purchases.slice().sort((a, b) => (b.purchaseDate || "").localeCompare(a.purchaseDate || ""))
    .filter((p) => (filter === "active" ? remainingOf(p) > 0 : filter === "done" ? remainingOf(p) === 0 : true));

  function deletePurchase(id) {
    setPurchases((prev) => prev.filter((p) => p.id !== id));
    setAttendance((prev) => prev.filter((a) => a.purchaseId !== id));
  }
  function updatePurchase(id, fields) {
    setPurchases((prev) => prev.map((p) => (p.id === id ? { ...p, ...fields } : p)));
  }

  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex gap-1.5">
          {[{ id: "active", label: "Active" }, { id: "done", label: "Completed" }, { id: "all", label: "All" }].map((f) => (
            <button key={f.id} onClick={() => setFilter(f.id)} className={`tab-btn px-3.5 py-2 text-sm ${filter === f.id ? "active" : ""}`}>{f.label}</button>
          ))}
        </div>
        <button className="btn btn-primary flex items-center gap-1.5 px-4 py-2.5 text-sm" disabled={students.length === 0} style={{ opacity: students.length === 0 ? 0.5 : 1 }} onClick={() => setAdding(true)}><Plus size={17} /> Add package</button>
      </div>

      {students.length === 0 && <Empty icon={Users} title="Add a student before creating a package" sub="Go to the Students tab to add your first student" />}
      {students.length > 0 && sorted.length === 0 && <Empty icon={BookOpenCheck} title="No packages in this filter" />}

      <div className="flex flex-col gap-2.5">
        {sorted.map((p) => {
          const cfg = TYPE_CONFIG[p.type];
          const rem = remainingOf(p);
          const cc = ccBreakdown(p);
          const ids = p.studentIds || [p.studentId];
          return (
            <div key={p.id} className="card p-4 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3 min-w-0">
                <div className="flex items-center justify-center rounded-lg shrink-0" style={{ width: 38, height: 38, background: "var(--teal-tint)", color: "var(--teal-dark)" }}><TypeIcon type={p.type} size={18} /></div>
                <div className="min-w-0">
                  <div className="flex flex-wrap gap-x-1">
                    {ids.map((sid, i) => (
                      <button key={sid} className="font-semibold" style={{ color: "var(--ink)", background: "none", border: "none", textAlign: "left" }} onClick={() => { setSelectedStudentId(sid); setTab("students"); }}>
                        {studentName(sid)}{i < ids.length - 1 ? " &" : ""}
                      </button>
                    ))}
                  </div>
                  <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{p.subject} · {cfg.label}</div>
                </div>
              </div>
              <div className="flex items-center gap-3 flex-wrap">
                <span className="text-xs fmono" style={{ color: "var(--ink-soft)" }}>{fmtBaht(p.pricePaid)}{p.paymentMethod === "credit" && cc.chargeExtra ? ` +${fmtBaht(cc.feeCost)}` : ""}</span>
                <RemainingBadge remaining={rem} total={p.totalUnits + (p.bonusUnits || 0)} unitName={cfg.unitName} />
                <button className="p-1.5" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => setEditingPurchase(p)}><Pencil size={15} /></button>
                <button className="btn-danger p-1.5" onClick={() => deletePurchase(p.id)}><Trash2 size={15} /></button>
              </div>
            </div>
          );
        })}
      </div>

      {adding && (
        <Modal onClose={() => setAdding(false)} title="Add a new package" wide>
          <AddPurchaseForm
            students={students} purchases={purchases} requireStudentPicker allowSharing subjects={subjects} setSubjects={setSubjects}
            onCancel={() => setAdding(false)}
            onSave={(purchase, creditApplied, feeInfo) => {
              const id = uid();
              setPurchases((prev) => [...prev, { ...purchase, id }]);
              if (feeInfo) {
                setRegistrationFees((prev) => [...prev, { id: uid(), studentId: purchase.studentIds[0], amount: feeInfo.amount, status: feeInfo.status, date: purchase.purchaseDate, note: "", creditUsedInPurchaseId: null }]);
              }
              setAttendance((prev) => prev.map((a) => (a.purchaseId === PENDING_PURCHASE_ID && purchase.studentIds.includes(a.studentId) ? { ...a, purchaseId: id } : a)));
              setAdding(false);
            }}
          />
        </Modal>
      )}

      {editingPurchase && (
        <Modal onClose={() => setEditingPurchase(null)} title={`Edit package — ${editingPurchase.subject}`} wide>
          <AddPurchaseForm
            students={students} purchases={purchases} allowSharing subjects={subjects} setSubjects={setSubjects}
            initial={editingPurchase}
            onCancel={() => setEditingPurchase(null)}
            onSave={(fields) => { updatePurchase(editingPurchase.id, fields); setEditingPurchase(null); }}
          />
        </Modal>
      )}
    </div>
  );
}

function AddPurchaseForm({ students, purchases, requireStudentPicker, preselectedStudentId, allowSharing, subjects, setSubjects, availableCredit, existingFeeStatus, initial, onSave, onCancel }) {
  const [studentIds, setStudentIds] = useState(initial ? (initial.studentIds || [initial.studentId]) : (preselectedStudentId ? [preselectedStudentId] : (students && students.length === 1 ? [students[0].id] : [])));
  const [addingSibling, setAddingSibling] = useState(false);
  const [subject, setSubject] = useState(initial ? initial.subject : "");
  const [type, setType] = useState(initial ? initial.type : "course");
  const [totalUnits, setTotalUnits] = useState(initial ? initial.totalUnits : TYPE_CONFIG.course.defaultUnits);
  const [bonusUnits, setBonusUnits] = useState(initial ? (initial.bonusUnits || 0) : 0);
  const [price, setPrice] = useState(initial ? String(initial.listPrice != null ? initial.listPrice : initial.pricePaid) : "");
  const [discountType, setDiscountType] = useState(initial ? (initial.discountType || "amount") : "amount");
  const [discountValue, setDiscountValue] = useState(initial ? String(initial.discountValue || 0) : "");
  const [applyCredit, setApplyCredit] = useState(false);
  const [method, setMethod] = useState(initial ? initial.paymentMethod : "cash");
  const [ccChargeExtra, setCcChargeExtra] = useState(initial ? initial.ccChargeExtra !== false : true);
  const [purchaseDate, setPurchaseDate] = useState(initial ? initial.purchaseDate : todayStr());
  const [regFeeStatus, setRegFeeStatus] = useState("skip");
  const [regFeeAmount, setRegFeeAmount] = useState(2500);

  useEffect(() => { if (!initial) setTotalUnits(TYPE_CONFIG[type].defaultUnits); }, [type]);

  const listPriceNum = Number(price) || 0;
  const discountValueNum = Number(discountValue) || 0;
  const manualDiscountAmount = discountType === "percent" ? listPriceNum * (discountValueNum / 100) : discountValueNum;
  const creditAmount = applyCredit && availableCredit ? availableCredit.amount : 0;
  const totalDiscountAmount = Math.min(listPriceNum, manualDiscountAmount + creditAmount);
  const priceNum = Math.max(0, listPriceNum - totalDiscountAmount);
  const cc = ccBreakdown({ pricePaid: priceNum, paymentMethod: method, ccChargeExtra });
  const bonusNum = Number(bonusUnits) || 0;
  const capacity = totalUnits + bonusNum;
  const perUnit = capacity > 0 ? cc.netRevenue / capacity : 0;
  const canSave = subject && subject.trim() && totalUnits > 0 && listPriceNum > 0 && studentIds.length > 0;

  const commonQuantities = useMemo(() => {
    const counts = {};
    (purchases || []).filter((p) => p.type === type).forEach((p) => { counts[p.totalUnits] = (counts[p.totalUnits] || 0) + 1; });
    const seeds = type === "course" ? [8, 16, 24] : [];
    const byFrequency = Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a]).slice(0, 4);
    return Array.from(new Set([...byFrequency, ...seeds])).sort((a, b) => a - b).slice(0, 6);
  }, [purchases, type]);

  const priceHistory = useMemo(() => {
    if (!subject || !totalUnits) return [];
    const counts = {};
    (purchases || [])
      .filter((p) => p.subject === subject && p.type === type && p.totalUnits === Number(totalUnits))
      .forEach((p) => { const lp = p.listPrice != null ? p.listPrice : p.pricePaid; counts[lp] = (counts[lp] || 0) + 1; });
    return Object.keys(counts).map(Number).sort((a, b) => counts[b] - counts[a]).slice(0, 4);
  }, [purchases, subject, type, totalUnits]);

  function addSubjectOption(v) {
    setSubjects((prev) => (prev.includes(v) ? prev : [...prev, v]));
  }
  const availableSiblings = students.filter((s) => !studentIds.includes(s.id));

  return (
    <div className="flex flex-col gap-3.5">
      {requireStudentPicker && studentIds.length === 0 && (
        <Field label="Student *">
          <select className="input w-full px-3 py-2.5 text-sm" value="" onChange={(e) => e.target.value && setStudentIds([e.target.value])}>
            <option value="">Select a student…</option>
            {students.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </Field>
      )}

      {studentIds.length > 0 && (
        <Field label={allowSharing ? "Student(s) — this package's pool of classes" : "Student"}>
          <div className="flex flex-wrap gap-1.5">
            {studentIds.map((sid) => {
              const s = students.find((x) => x.id === sid);
              return (
                <span key={sid} className="badge flex items-center gap-1" style={{ background: "var(--teal-tint)", color: "var(--teal-dark)" }}>
                  {s ? s.name : "—"}
                  {studentIds.length > 1 && (
                    <button type="button" onClick={() => setStudentIds((prev) => prev.filter((x) => x !== sid))} style={{ background: "none", border: "none", color: "inherit", cursor: "pointer", padding: 0, display: "flex" }}>
                      <X size={12} />
                    </button>
                  )}
                </span>
              );
            })}
          </div>
          {allowSharing && (
            addingSibling ? (
              <div className="flex gap-2 mt-2">
                <select className="input flex-1 px-3 py-2.5 text-sm" onChange={(e) => { if (e.target.value) { setStudentIds((prev) => [...prev, e.target.value]); setAddingSibling(false); } }} defaultValue="">
                  <option value="">Select sibling…</option>
                  {availableSiblings.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
                <button type="button" className="btn btn-ghost px-3 py-2.5 text-sm" onClick={() => setAddingSibling(false)}><X size={15} /></button>
              </div>
            ) : (
              availableSiblings.length > 0 && (
                <button type="button" className="text-xs font-semibold mt-2" style={{ color: "var(--teal-dark)", background: "none", border: "none" }} onClick={() => setAddingSibling(true)}>
                  + Share this package with a sibling
                </button>
              )
            )
          )}
        </Field>
      )}

      <Field label="Subject / course name *">
        <ComboSelect value={subject} onChange={setSubject} options={subjects} onAddOption={addSubjectOption} placeholder="e.g. Math, Coding, Art" />
      </Field>
      <Field label="Type *">
        <div className="grid grid-cols-2 gap-2">
          {Object.entries(TYPE_CONFIG).map(([key, cfg]) => (
            <button key={key} onClick={() => setType(key)} className="flex items-center gap-2 px-3 py-2.5 rounded-lg text-left text-sm" style={{ border: type === key ? "2px solid var(--teal)" : "1px solid var(--line)", background: type === key ? "var(--teal-tint)" : "transparent" }}>
              <TypeIcon type={key} size={16} />
              <div><div className="font-medium" style={{ color: "var(--ink)" }}>{cfg.label}</div><div className="text-xs" style={{ color: "var(--ink-soft)" }}>{cfg.hint}</div></div>
            </button>
          ))}
        </div>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label={`Paid quantity (${TYPE_CONFIG[type].unitName}s) *`}>
          <input type="number" min="1" step="0.5" className="input w-full px-3 py-2.5 text-sm fmono" value={totalUnits} onChange={(e) => setTotalUnits(Number(e.target.value))} />
          {commonQuantities.length > 0 && (
            <div className="flex flex-wrap gap-1.5 mt-1.5">
              {commonQuantities.map((q) => (
                <button type="button" key={q} onClick={() => setTotalUnits(q)} className="badge fmono" style={{ background: totalUnits === q ? "var(--teal)" : "var(--teal-tint)", color: totalUnits === q ? "white" : "var(--teal-dark)", border: "none", cursor: "pointer" }}>{fmtNum(q)}</button>
              ))}
            </div>
          )}
        </Field>
        <Field label={`Bonus ${TYPE_CONFIG[type].unitName}s (free, optional)`}><input type="number" min="0" step="0.5" className="input w-full px-3 py-2.5 text-sm fmono" placeholder="0" value={bonusUnits} onChange={(e) => setBonusUnits(e.target.value)} /></Field>
      </div>
      {bonusNum > 0 && (
        <div className="text-xs fmono" style={{ color: "var(--teal-dark)", marginTop: -6 }}>
          Total available: {fmtNum(capacity)} {TYPE_CONFIG[type].unitName}{capacity !== 1 ? "s" : ""} ({fmtNum(totalUnits)} paid + {fmtNum(bonusNum)} bonus)
        </div>
      )}
      <Field label="Purchase date"><input type="date" className="input w-full px-3 py-2.5 text-sm fmono" value={purchaseDate} onChange={(e) => setPurchaseDate(e.target.value)} /></Field>

      <Field label="Full price (THB) *">
        <input type="number" min="0" className="input w-full px-3 py-2.5 text-sm fmono" placeholder="0" value={price} onChange={(e) => setPrice(e.target.value)} />
        {priceHistory.length > 0 && (
          <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
            <span className="text-xs" style={{ color: "var(--ink-soft)" }}>Used before for {subject} × {fmtNum(totalUnits)}:</span>
            {priceHistory.map((pr) => (
              <button type="button" key={pr} onClick={() => setPrice(String(pr))} className="badge fmono" style={{ background: "var(--amber-tint)", color: "#92651A", border: "none", cursor: "pointer" }}>{fmtBaht(pr)}</button>
            ))}
          </div>
        )}
      </Field>

      <Field label="Discount (optional)">
        <div className="flex gap-2">
          <div className="flex rounded-lg overflow-hidden shrink-0" style={{ border: "1px solid var(--line)" }}>
            <button type="button" onClick={() => setDiscountType("amount")} className="px-3 py-2.5 text-sm font-medium" style={{ background: discountType === "amount" ? "var(--teal)" : "transparent", color: discountType === "amount" ? "white" : "var(--ink)", border: "none" }}>฿</button>
            <button type="button" onClick={() => setDiscountType("percent")} className="px-3 py-2.5 text-sm font-medium" style={{ background: discountType === "percent" ? "var(--teal)" : "transparent", color: discountType === "percent" ? "white" : "var(--ink)", border: "none" }}>%</button>
          </div>
          <input type="number" min="0" className="input flex-1 px-3 py-2.5 text-sm fmono" placeholder="0" value={discountValue} onChange={(e) => setDiscountValue(e.target.value)} />
        </div>
      </Field>

      {availableCredit && (
        <label className="flex items-start gap-2 text-sm card p-3" style={{ background: applyCredit ? "var(--amber-tint)" : "transparent", cursor: "pointer" }}>
          <input type="checkbox" checked={applyCredit} onChange={(e) => setApplyCredit(e.target.checked)} style={{ marginTop: 2 }} />
          <span style={{ color: applyCredit ? "#5A4118" : "var(--ink-soft)" }}>
            Apply registration fee credit ({fmtBaht(availableCredit.amount)}) as a discount on this purchase
          </span>
        </label>
      )}

      <Field label="Payment method">
        <div className="grid grid-cols-2 gap-2">
          <button onClick={() => setMethod("cash")} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-sm font-medium" style={{ border: method === "cash" ? "2px solid var(--teal)" : "1px solid var(--line)", background: method === "cash" ? "var(--teal-tint)" : "transparent", color: "var(--ink)" }}><Wallet size={16} /> Cash / transfer</button>
          <button onClick={() => setMethod("credit")} className="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-sm font-medium" style={{ border: method === "credit" ? "2px solid var(--teal)" : "1px solid var(--line)", background: method === "credit" ? "var(--teal-tint)" : "transparent", color: "var(--ink)" }}><CreditCard size={16} /> Credit card</button>
        </div>
      </Field>

      {method === "credit" && (
        <Field label="Who covers the 3% card fee?">
          <div className="grid grid-cols-2 gap-2">
            <button type="button" onClick={() => setCcChargeExtra(true)} className="flex flex-col items-start px-3 py-2.5 rounded-lg text-left text-sm" style={{ border: ccChargeExtra ? "2px solid var(--teal)" : "1px solid var(--line)", background: ccChargeExtra ? "var(--teal-tint)" : "transparent" }}>
              <span className="font-medium" style={{ color: "var(--ink)" }}>Customer pays +3%</span>
              <span className="text-xs" style={{ color: "var(--ink-soft)" }}>Fee passed on, full price counts as revenue</span>
            </button>
            <button type="button" onClick={() => setCcChargeExtra(false)} className="flex flex-col items-start px-3 py-2.5 rounded-lg text-left text-sm" style={{ border: !ccChargeExtra ? "2px solid var(--teal)" : "1px solid var(--line)", background: !ccChargeExtra ? "var(--teal-tint)" : "transparent" }}>
              <span className="font-medium" style={{ color: "var(--ink)" }}>School absorbs 3%</span>
              <span className="text-xs" style={{ color: "var(--ink-soft)" }}>No extra charge; reduces net revenue</span>
            </button>
          </div>
        </Field>
      )}

      {listPriceNum > 0 && totalUnits > 0 && (
        <div className="card p-3.5 fmono text-xs flex flex-col gap-1" style={{ background: "var(--teal-tint)", border: "none" }}>
          {totalDiscountAmount > 0 && (<>
            <div className="flex justify-between"><span>Full price</span><span>{fmtBaht(listPriceNum)}</span></div>
            {manualDiscountAmount > 0 && <div className="flex justify-between"><span>Discount{discountType === "percent" ? ` (${fmtNum(discountValueNum)}%)` : ""}</span><span>-{fmtBaht(manualDiscountAmount)}</span></div>}
            {creditAmount > 0 && <div className="flex justify-between"><span>Registration credit</span><span>-{fmtBaht(creditAmount)}</span></div>}
          </>)}
          <div className="flex justify-between"><span>Net price paid</span><span className="font-semibold">{fmtBaht(priceNum)}</span></div>
          <div className="flex justify-between"><span>Price per {TYPE_CONFIG[type].unitName}{bonusNum > 0 ? ` (spread over ${fmtNum(capacity)} incl. bonus)` : ""}</span><span className="font-semibold">{fmtBaht(perUnit)}</span></div>
          {method === "credit" && (<>
            <div className="flex justify-between" style={{ borderTop: "1px solid rgba(0,0,0,0.08)", paddingTop: 4, marginTop: 2 }}><span>Card network fee (3%, owed to bank)</span><span className="font-semibold">{fmtBaht(cc.feeCost)}</span></div>
            {ccChargeExtra ? (
              <div className="flex justify-between"><span>Total charged to customer</span><span className="font-semibold">{fmtBaht(cc.customerCharged)}</span></div>
            ) : (
              <div className="flex justify-between"><span>School's net revenue (fee absorbed)</span><span className="font-semibold">{fmtBaht(cc.netRevenue)}</span></div>
            )}
          </>)}
        </div>
      )}

      {!initial && (
        <Field label="Registration fee (for new students, optional)">
          {existingFeeStatus ? (
            <div className="text-xs fmono" style={{ color: "var(--ink-soft)" }}>Already recorded for this student: {existingFeeStatus}. Manage it from the student's profile.</div>
          ) : (
            <div className="flex flex-col gap-2">
              <div className="grid grid-cols-2 gap-2">
                {[
                  { id: "skip", label: "Skip", hint: "Handle separately / not applicable" },
                  { id: "paid", label: "Collected", hint: "Standard, not usable as future credit" },
                  { id: "credit", label: "Collected as credit", hint: "Usable as a discount next renewal" },
                  { id: "waived", label: "Waived", hint: "Not charged" },
                ].map((o) => (
                  <button type="button" key={o.id} onClick={() => setRegFeeStatus(o.id)} className="flex flex-col items-start px-3 py-2.5 rounded-lg text-left text-sm" style={{ border: regFeeStatus === o.id ? "2px solid var(--teal)" : "1px solid var(--line)", background: regFeeStatus === o.id ? "var(--teal-tint)" : "transparent" }}>
                    <span className="font-medium" style={{ color: "var(--ink)" }}>{o.label}</span>
                    <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{o.hint}</span>
                  </button>
                ))}
              </div>
              {(regFeeStatus === "paid" || regFeeStatus === "credit") && (
                <input type="number" min="0" className="input px-3 py-2.5 text-sm fmono" value={regFeeAmount} onChange={(e) => setRegFeeAmount(e.target.value)} />
              )}
            </div>
          )}
        </Field>
      )}

      <div className="flex justify-end gap-2 pt-1">
        <button className="btn btn-ghost px-4 py-2.5 text-sm" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary px-5 py-2.5 text-sm" disabled={!canSave} style={{ opacity: canSave ? 1 : 0.45 }}
          onClick={() => onSave({
            studentIds, subject: subject.trim(), type,
            totalUnits: Number(totalUnits), bonusUnits: bonusNum,
            listPrice: listPriceNum, discountType, discountValue: discountValueNum, discountAmount: totalDiscountAmount,
            pricePaid: priceNum, paymentMethod: method, ccChargeExtra: method === "credit" ? ccChargeExtra : undefined,
            purchaseDate,
          }, applyCredit, initial ? null : (regFeeStatus !== "skip" ? { status: regFeeStatus, amount: regFeeStatus === "waived" ? 0 : (Number(regFeeAmount) || 0) } : null))}>
          {initial ? "Save changes" : "Save package"}
        </button>
      </div>
    </div>
  );
}

/* =========================================================
   REPORTS VIEW
   ========================================================= */

function ReportsView({ students, purchases, attendance, remainingOf, studentName, registrationFees }) {
  const [periodMode, setPeriodMode] = useState("month");
  const [selMonth, setSelMonth] = useState(todayStr().slice(0, 7));
  const [selYear, setSelYear] = useState(todayStr().slice(0, 4));
  const [customStart, setCustomStart] = useState(todayStr().slice(0, 8) + "01");
  const [customEnd, setCustomEnd] = useState(todayStr());

  function shiftMonth(delta) {
    const [y, m] = selMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setSelMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  function shiftYear(delta) {
    setSelYear(String(Number(selYear) + delta));
  }

  let rangeStart = null, rangeEnd = null, periodLabel = "All time";
  if (periodMode === "month") {
    const [y, m] = selMonth.split("-").map(Number);
    rangeStart = `${selMonth}-01`;
    rangeEnd = `${selMonth}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`;
    periodLabel = new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  } else if (periodMode === "year") {
    rangeStart = `${selYear}-01-01`;
    rangeEnd = `${selYear}-12-31`;
    periodLabel = selYear;
  } else if (periodMode === "custom") {
    rangeStart = customStart;
    rangeEnd = customEnd;
    periodLabel = `${fmtDate(customStart)} – ${fmtDate(customEnd)}`;
  }
  const inRange = (d) => !rangeStart || (d >= rangeStart && d <= rangeEnd);
  const fPurchases = purchases.filter((p) => inRange(p.purchaseDate));
  const fAttendance = attendance.filter((a) => inRange(a.date));

  const totalRevenue = fPurchases.reduce((sum, p) => sum + ccBreakdown(p).netRevenue, 0);
  const totalFeesCost = fPurchases.reduce((sum, p) => sum + ccBreakdown(p).feeCost, 0);
  const totalFeesAbsorbed = fPurchases.reduce((sum, p) => { const cc = ccBreakdown(p); return sum + (cc.chargeExtra ? 0 : cc.feeCost); }, 0);
  const totalDiscounts = fPurchases.reduce((sum, p) => sum + (p.discountAmount != null ? p.discountAmount : (p.discount || 0)), 0);
  const totalBonusUnits = fPurchases.reduce((sum, p) => sum + (p.bonusUnits || 0), 0);

  // Active = checked in (any status) within the last 3 months, regardless of the report period selected above.
  const activityCutoff = (() => {
    const d = new Date();
    d.setMonth(d.getMonth() - 3);
    return d.toISOString().slice(0, 10);
  })();
  const lastSeenByStudent = {};
  attendance.forEach((a) => {
    if (!lastSeenByStudent[a.studentId] || a.date > lastSeenByStudent[a.studentId]) lastSeenByStudent[a.studentId] = a.date;
  });
  const activeStudentCount = students.filter((s) => lastSeenByStudent[s.id] && lastSeenByStudent[s.id] >= activityCutoff).length;
  const nonActiveStudentCount = students.length - activeStudentCount;
  const totalRegFees = (registrationFees || []).filter((r) => inRange(r.date)).reduce((sum, r) => sum + (r.status === "waived" ? 0 : r.amount), 0);
  const noShowCount = fAttendance.filter((a) => a.attended === false).length;
  const checkinsInPeriod = fAttendance.filter((a) => a.purchaseId !== PENDING_PURCHASE_ID).length;

  // Bank charges an extra flat fee if monthly card volume falls short of the minimum.
  const ccVolume = fPurchases.filter((p) => p.paymentMethod === "credit").reduce((sum, p) => sum + ccBreakdown(p).customerCharged, 0);
  const belowMonthlyMin = periodMode === "month" && ccVolume > 0 && ccVolume < CC_MONTHLY_MIN;
  const totalFeesCostWithShortfall = totalFeesCost + (belowMonthlyMin ? CC_MONTHLY_SHORTFALL_FEE : 0);

  const lowBalance = purchases.map((p) => ({ p, rem: remainingOf(p) })).filter(({ p, rem }) => rem > 0 && rem <= Math.max(1, Math.round((p.totalUnits + (p.bonusUnits || 0)) * 0.2))).sort((a, b) => a.rem - b.rem);

  const pendingAdvanceByStudent = {};
  attendance.forEach((a) => {
    if (a.purchaseId !== PENDING_PURCHASE_ID) return;
    pendingAdvanceByStudent[a.studentId] = (pendingAdvanceByStudent[a.studentId] || 0) + a.unitsUsed;
  });
  const pendingAdvanceRows = Object.entries(pendingAdvanceByStudent).filter(([, v]) => v > 0);

  const bySubject = {};
  fPurchases.forEach((p) => { bySubject[p.subject] = (bySubject[p.subject] || 0) + ccBreakdown(p).netRevenue; });
  const subjectRows = Object.entries(bySubject).sort((a, b) => b[1] - a[1]);
  const maxSubject = subjectRows.length ? subjectRows[0][1] : 1;

  // Value taught per teacher = sum of (units they taught × package price per unit),
  // based on the price of the package used in each session — separate from revenue collected.
  const byTeacher = {};
  fAttendance.forEach((a) => {
    if (!a.teacher) return;
    const p = purchases.find((x) => x.id === a.purchaseId);
    if (!p) return;
    const perUnit = netPricePerUnit(p);
    byTeacher[a.teacher] = (byTeacher[a.teacher] || 0) + perUnit * a.unitsUsed;
  });
  const teacherRows = Object.entries(byTeacher).sort((a, b) => b[1] - a[1]);
  const maxTeacher = teacherRows.length ? teacherRows[0][1] : 1;
  const unassignedSessions = fAttendance.filter((a) => !a.teacher && a.purchaseId !== PENDING_PURCHASE_ID).length;

  return (
    <div className="flex flex-col gap-5">
      <div className="card p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex gap-1.5">
          {[{ id: "month", label: "Month" }, { id: "year", label: "Year" }, { id: "custom", label: "Custom" }, { id: "all", label: "All time" }].map((f) => (
            <button key={f.id} onClick={() => setPeriodMode(f.id)} className={`tab-btn px-3.5 py-2 text-sm ${periodMode === f.id ? "active" : ""}`}>{f.label}</button>
          ))}
        </div>
        {periodMode === "month" && (
          <div className="flex items-center gap-2">
            <button className="p-1.5 rounded-full" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => shiftMonth(-1)}><ChevronLeft size={18} /></button>
            <span className="text-sm font-semibold fmono" style={{ color: "var(--ink)", minWidth: 130, textAlign: "center" }}>{periodLabel}</span>
            <button className="p-1.5 rounded-full" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => shiftMonth(1)}><ChevronRight size={18} /></button>
          </div>
        )}
        {periodMode === "year" && (
          <div className="flex items-center gap-2">
            <button className="p-1.5 rounded-full" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => shiftYear(-1)}><ChevronLeft size={18} /></button>
            <span className="text-sm font-semibold fmono" style={{ color: "var(--ink)", minWidth: 60, textAlign: "center" }}>{periodLabel}</span>
            <button className="p-1.5 rounded-full" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => shiftYear(1)}><ChevronRight size={18} /></button>
          </div>
        )}
        {periodMode === "custom" && (
          <div className="flex items-center gap-2">
            <input type="date" className="input fmono text-sm px-2 py-1.5" value={customStart} onChange={(e) => setCustomStart(e.target.value)} />
            <span className="text-sm" style={{ color: "var(--ink-soft)" }}>to</span>
            <input type="date" className="input fmono text-sm px-2 py-1.5" value={customEnd} onChange={(e) => setCustomEnd(e.target.value)} />
          </div>
        )}
      </div>

      {belowMonthlyMin && (
        <div className="card p-4 flex items-start gap-2.5" style={{ background: "var(--amber-tint)", border: "none" }}>
          <AlertCircle size={18} style={{ color: "#92651A" }} className="shrink-0 mt-0.5" />
          <div className="text-sm" style={{ color: "#5A4118" }}>
            Card volume this month is {fmtBaht(ccVolume)}, below the {fmtBaht(CC_MONTHLY_MIN)} minimum — the bank charges an extra {fmtBaht(CC_MONTHLY_SHORTFALL_FEE)} fee, already added to "Card fees owed to bank" below.
          </div>
        </div>
      )}

      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(180px,1fr))" }}>
        <StatCard label="Active students" value={activeStudentCount.toString()} icon={Users} />
        <StatCard label="Non-active students (3mo+)" value={nonActiveStudentCount.toString()} icon={Users} />
        <StatCard label="Packages purchased" value={fPurchases.length.toString()} icon={BookOpenCheck} />
        <StatCard label="Net course revenue" value={fmtBaht(totalRevenue)} icon={Wallet} />
        <StatCard label="Registration fees collected" value={fmtBaht(totalRegFees)} icon={Wallet} />
        <StatCard label="Card fees owed to bank" value={fmtBaht(totalFeesCostWithShortfall)} icon={CreditCard} />
        <StatCard label="Card fees absorbed by school" value={fmtBaht(totalFeesAbsorbed)} icon={CreditCard} />
        <StatCard label="Total discounts given" value={fmtBaht(totalDiscounts)} icon={Wallet} />
        <StatCard label="Bonus classes given" value={fmtNum(totalBonusUnits)} icon={BookOpenCheck} />
        <StatCard label="Charged absences" value={noShowCount.toString()} icon={AlertCircle} />
      </div>
      <div className="card p-4">
        <div className="text-sm font-semibold mb-0.5" style={{ color: "var(--ink)" }}>Check-ins — {periodLabel}</div>
        <div className="fdisplay" style={{ fontSize: 30, fontWeight: 700, color: "var(--teal-dark)" }}>{checkinsInPeriod} <span className="text-base fmono" style={{ color: "var(--ink-soft)", fontWeight: 400 }}>sessions</span></div>
      </div>
      <div>
        <SectionTitle>Net revenue by subject</SectionTitle>
        {subjectRows.length === 0 ? <div className="text-sm" style={{ color: "var(--ink-soft)" }}>No data in this period</div> : (
          <div className="card p-4 flex flex-col gap-3">
            {subjectRows.map(([subj, amt]) => (
              <div key={subj}>
                <div className="flex justify-between text-sm mb-1"><span style={{ color: "var(--ink)" }} className="font-medium">{subj}</span><span className="fmono" style={{ color: "var(--ink-soft)" }}>{fmtBaht(amt)}</span></div>
                <div className="h-2 rounded-full overflow-hidden" style={{ background: "var(--teal-tint)" }}><div className="h-full rounded-full" style={{ width: `${(amt / maxSubject) * 100}%`, background: "var(--teal)" }} /></div>
              </div>
            ))}
          </div>
        )}
      </div>
      <div>
        <SectionTitle>Value taught by teacher</SectionTitle>
        {teacherRows.length === 0 ? (
          <div className="text-sm" style={{ color: "var(--ink-soft)" }}>No check-ins with a teacher assigned in this period</div>
        ) : (
          <div className="card p-4 flex flex-col gap-3">
            {teacherRows.map(([t, amt]) => (
              <div key={t}>
                <div className="flex justify-between text-sm mb-1"><span style={{ color: "var(--ink)" }} className="font-medium">{t}</span><span className="fmono" style={{ color: "var(--ink-soft)" }}>{fmtBaht(amt)}</span></div>
                <div className="h-2 rounded-full overflow-hidden" style={{ background: "var(--teal-tint)" }}><div className="h-full rounded-full" style={{ width: `${(amt / maxTeacher) * 100}%`, background: "var(--amber)" }} /></div>
              </div>
            ))}
            {unassignedSessions > 0 && (
              <div className="text-xs fmono" style={{ color: "var(--ink-soft)", borderTop: "1px solid var(--line)", paddingTop: 10 }}>
                {unassignedSessions} check-in{unassignedSessions !== 1 ? "s" : ""} without a teacher assigned
              </div>
            )}
          </div>
        )}
      </div>
      <div>
        <SectionTitle>Charged absences (billed but did not attend) — {periodLabel}</SectionTitle>
        {noShowCount === 0 ? <div className="text-sm" style={{ color: "var(--ink-soft)" }}>None in this period</div> : (
          <div className="card divide-y">
            {fAttendance.filter((a) => a.attended === false).sort((a, b) => b.date.localeCompare(a.date)).map((a) => {
              const p = purchases.find((x) => x.id === a.purchaseId);
              return (
                <div key={a.id} className="flex items-center justify-between px-4 py-2.5">
                  <div className="text-sm">
                    <span className="fmono" style={{ color: "var(--ink-soft)" }}>{fmtDate(a.date)}</span>{" "}
                    <span className="font-medium" style={{ color: "var(--ink)" }}>{studentName(a.studentId)}</span>
                    <span style={{ color: "var(--ink-soft)" }}> · {p?.subject || "—"}</span>
                  </div>
                  <span className="text-xs fmono" style={{ color: "var(--coral)" }}>{fmtNum(a.unitsUsed)} {p ? TYPE_CONFIG[p.type].unitName : ""}{a.unitsUsed !== 1 ? "s" : ""} charged</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
      <div>
        <SectionTitle>Owed classes (checked in with no package yet)</SectionTitle>
        {pendingAdvanceRows.length === 0 ? <div className="text-sm" style={{ color: "var(--ink-soft)" }}>None right now</div> : (
          <div className="card divide-y">
            {pendingAdvanceRows.map(([sid, units]) => (
              <div key={sid} className="flex items-center justify-between px-4 py-2.5">
                <span className="font-medium text-sm" style={{ color: "var(--ink)" }}>{studentName(sid)}</span>
                <span className="text-xs fmono" style={{ color: "var(--coral)" }}>owes {fmtNum(units)} class{units !== 1 ? "es" : ""}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div>
        <SectionTitle>Running low (follow up)</SectionTitle>
        {lowBalance.length === 0 ? <div className="text-sm" style={{ color: "var(--ink-soft)" }}>No packages running low right now</div> : (
          <div className="card divide-y">
            {lowBalance.map(({ p, rem }) => (
              <div key={p.id} className="flex items-center justify-between px-4 py-2.5">
                <div className="text-sm"><span className="font-medium" style={{ color: "var(--ink)" }}>{(p.studentIds || [p.studentId]).map(studentName).join(" & ")}</span><span style={{ color: "var(--ink-soft)" }}> · {p.subject}</span></div>
                <RemainingBadge remaining={rem} total={p.totalUnits + (p.bonusUnits || 0)} unitName={TYPE_CONFIG[p.type].unitName} />
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function StatCard({ label, value, icon: Icon }) {
  return (
    <div className="card p-4">
      <div className="flex items-center gap-2 mb-2" style={{ color: "var(--teal-dark)" }}><Icon size={16} /><span className="text-xs font-semibold" style={{ color: "var(--ink-soft)" }}>{label}</span></div>
      <div className="fdisplay" style={{ fontSize: 22, fontWeight: 700, color: "var(--ink)" }}>{value}</div>
    </div>
  );
}

/* =========================================================
   BACKUP VIEW — download Excel (always works) + auto-sync to a
   Google Sheet via Apps Script (works because this page is hosted
   as a real website, not inside Claude's sandboxed preview)
   ========================================================= */

function buildWorkbook({ students, purchases, attendance, usedUnitsByPurchase, remainingOf, studentName, registrationFees }) {
  const wb = XLSX.utils.book_new();
  const studentRows = students.map((s) => ({ ID: s.id, Name: s.name, Phone: s.phone || "", Note: s.note || "" }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(studentRows), "Students");

  const purchaseRowOf = (p) => {
    const cfg = TYPE_CONFIG[p.type];
    const cc = ccBreakdown(p);
    const used = usedUnitsByPurchase[p.id] || 0;
    const names = (p.studentIds || [p.studentId]).map(studentName).join(" & ");
    const discountAmt = p.discountAmount != null ? p.discountAmount : (p.discount || 0);
    return {
      ID: p.id, Student: names, Subject: p.subject, Type: cfg.label,
      "Total Units": p.totalUnits, "Bonus Units": p.bonusUnits || 0, Unit: cfg.unitName,
      "List Price (THB)": p.listPrice != null ? p.listPrice : p.pricePaid,
      "Discount Type": p.discountType || "amount", "Discount Value": p.discountValue || 0, "Discount Amount (THB)": Math.round(discountAmt),
      "Price Paid (THB)": p.pricePaid, "Payment Method": p.paymentMethod === "credit" ? "Credit card" : "Cash",
      "CC Fee Owed to Bank (THB)": Math.round(cc.feeCost),
      "CC Charged to Customer?": p.paymentMethod === "credit" ? (cc.chargeExtra ? "Yes" : "No, absorbed") : "",
      "Customer Charged (THB)": Math.round(cc.customerCharged), "School Net Revenue (THB)": Math.round(cc.netRevenue),
      "Price / Unit (THB)": Math.round(netPricePerUnit(p) * 100) / 100,
      "Purchase Date": p.purchaseDate, Used: used, Remaining: remainingOf(p),
    };
  };
  const activePurchases = purchases.filter((p) => remainingOf(p) > 0);
  const completedPurchases = purchases.filter((p) => remainingOf(p) === 0);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(activePurchases.map(purchaseRowOf)), "Purchases");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(completedPurchases.map(purchaseRowOf)), "Completed Packages");

  const attendanceRows = attendance.slice().sort((a, b) => a.date.localeCompare(b.date)).map((a) => {
    const p = purchases.find((x) => x.id === a.purchaseId);
    return { Date: a.date, Student: studentName(a.studentId), Subject: p?.subject || "", "Units Used": a.unitsUsed, Unit: p ? TYPE_CONFIG[p.type].unitName : "", Teacher: a.teacher || "", Status: a.attended === false ? "Charged, absent" : "Attended", Note: a.note || "" };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(attendanceRows), "Attendance");

  if (registrationFees && registrationFees.length) {
    const feeRows = registrationFees.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).map((r) => ({
      Student: studentName(r.studentId), "Amount (THB)": r.amount,
      Status: r.status === "waived" ? "Waived" : r.status === "credit" ? (r.creditUsedInPurchaseId ? "Credit used" : "Credit available") : "Collected",
      Date: r.date, Note: r.note || "",
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(feeRows), "Registration Fees");
  }

  const byTeacher = {};
  attendance.forEach((a) => {
    if (!a.teacher) return;
    const p = purchases.find((x) => x.id === a.purchaseId);
    if (!p) return;
    byTeacher[a.teacher] = (byTeacher[a.teacher] || 0) + netPricePerUnit(p) * a.unitsUsed;
  });
  const teacherRows = Object.entries(byTeacher).sort((a, b) => b[1] - a[1]).map(([teacher, value]) => ({ Teacher: teacher, "Value Taught (THB)": Math.round(value) }));
  if (teacherRows.length) {
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(teacherRows), "By Teacher");
  }

  return wb;
}

function BackupView({ students, setStudents, purchases, setPurchases, attendance, setAttendance, subjects, setSubjects, teachers, setTeachers, usedUnitsByPurchase, remainingOf, studentName, registrationFees, setRegistrationFees, sheetUrl, setSheetUrl, autoSync, setAutoSync, lastSynced, doSync }) {
  const [justDownloaded, setJustDownloaded] = useState(false);
  const [draftUrl, setDraftUrl] = useState(sheetUrl);
  const [syncing, setSyncing] = useState(false);
  const [copied, setCopied] = useState(false);
  const [justSaved, setJustSaved] = useState(false);
  const [confirmEmptySync, setConfirmEmptySync] = useState(false);
  const [restoring, setRestoring] = useState(false);
  const [restoreError, setRestoreError] = useState("");
  const [showPasteRestore, setShowPasteRestore] = useState(false);
  const [pasteText, setPasteText] = useState("");
  const [restoredOk, setRestoredOk] = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);

  useEffect(() => setDraftUrl(sheetUrl), [sheetUrl]);

  function handleDownload() {
    const wb = buildWorkbook({ students, purchases, attendance, usedUnitsByPurchase, remainingOf, studentName, registrationFees });
    XLSX.writeFile(wb, `school-data-${todayStr()}.xlsx`);
    setJustDownloaded(true);
    setTimeout(() => setJustDownloaded(false), 2500);
  }
  async function handleCopy() {
    try { await navigator.clipboard.writeText(APPS_SCRIPT_CODE); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch (e) {}
  }
  async function handleSyncNow() {
    setSyncing(true);
    const result = await doSync();
    setSyncing(false);
    if (result === "EMPTY_GUARD") setConfirmEmptySync(true);
  }
  async function handleConfirmedEmptySync() {
    setConfirmEmptySync(false);
    setSyncing(true);
    await doSync(true);
    setSyncing(false);
  }
  function handleSaveUrl() { setSheetUrl(draftUrl.trim()); setJustSaved(true); setTimeout(() => setJustSaved(false), 1500); }

  function applyRestoredData(data) {
    setStudents(data.students || []);
    setPurchases(data.purchases || []);
    setAttendance(data.attendance || []);
    setSubjects(data.subjects || []);
    setTeachers(data.teachers || []);
    setRegistrationFees(data.registrationFees || []);
    setRestoredOk(true);
    setTimeout(() => setRestoredOk(false), 3000);
  }

  async function handleAutoRestore() {
    if (!sheetUrl) return;
    setRestoring(true);
    setRestoreError("");
    try {
      const data = await restoreFromSheet(sheetUrl);
      applyRestoredData(data);
    } catch (e) {
      setRestoreError("Automatic restore didn't work (this can happen due to browser cross-origin restrictions). Use \"Open backup link\" below instead — it always works.");
    }
    setRestoring(false);
  }

  function mergeRestoredData(data) {
    const mergeArr = (existingArr, incomingArr) => {
      const ids = new Set(existingArr.map((x) => x.id));
      const additions = (incomingArr || []).filter((x) => !ids.has(x.id));
      return [...existingArr, ...additions];
    };
    setStudents((prev) => mergeArr(prev, data.students));
    setPurchases((prev) => mergeArr(prev, data.purchases));
    setAttendance((prev) => mergeArr(prev, data.attendance));
    setRegistrationFees((prev) => mergeArr(prev, data.registrationFees));
    setSubjects((prev) => Array.from(new Set([...prev, ...(data.subjects || [])])));
    setTeachers((prev) => Array.from(new Set([...prev, ...(data.teachers || [])])));
    setRestoredOk(true);
    setTimeout(() => setRestoredOk(false), 3000);
  }

  function handleImportPasted(mode) {
    try {
      const data = JSON.parse(pasteText);
      if (mode === "merge") mergeRestoredData(data);
      else applyRestoredData(data);
      setPasteText("");
      setShowPasteRestore(false);
      setRestoreError("");
    } catch (e) {
      setRestoreError("That doesn't look like valid backup JSON — make sure you copied the whole thing.");
    }
  }

  const steps = [
    { title: "Create a Google Sheet", body: "Open sheets.google.com and start a new blank spreadsheet." },
    { title: "Open the script editor", body: "In the sheet, go to Extensions → Apps Script." },
    { title: "Paste the code", body: "Delete the default code and paste the code below, then save (⌘S / Ctrl+S)." },
    { title: "Deploy as a web app", body: "Deploy → New deployment → type Web app. Execute as: Me. Who has access: Anyone. Deploy, then authorize when asked." },
    { title: "Copy the web app URL", body: "Copy the URL ending in /exec and paste it below." },
  ];

  return (
    <div className="flex flex-col gap-5">
      <div className="card p-5 flex flex-col items-center text-center gap-3" style={{ background: "var(--teal-tint)", border: "none" }}>
        <div className="flex items-center justify-center rounded-full" style={{ width: 52, height: 52, background: "var(--paper)", color: "var(--teal-dark)" }}><FileSpreadsheet size={26} /></div>
        <div>
          <div className="fdisplay" style={{ fontSize: 19, fontWeight: 700, color: "var(--ink)" }}>Download as Excel</div>
          <div className="text-sm mt-1" style={{ color: "var(--ink-soft)", maxWidth: 420 }}>A single file with Students, Purchases and Attendance sheets, fully calculated.</div>
        </div>
        <button className="btn btn-primary flex items-center gap-2 px-5 py-3 text-sm" onClick={handleDownload}>
          {justDownloaded ? <CheckCircle size={17} /> : <Download size={17} />} {justDownloaded ? "Downloaded!" : "Download .xlsx"}
        </button>
        <div className="text-xs fmono" style={{ color: "var(--ink-soft)" }}>{students.length} students · {purchases.length} packages · {attendance.length} check-ins</div>
      </div>

      <div>
        <SectionTitle>Sync to a Google Sheet</SectionTitle>
        <div className="card p-4 flex flex-col gap-3">
          <Field label="Google Apps Script web app URL">
            <input className="input w-full px-3 py-2.5 text-sm fmono" placeholder="https://script.google.com/macros/s/…/exec" value={draftUrl} onChange={(e) => setDraftUrl(e.target.value)} />
          </Field>
          <div className="flex flex-wrap items-center gap-2">
            <button className="btn btn-primary px-4 py-2.5 text-sm" onClick={handleSaveUrl} disabled={!draftUrl.trim()} style={{ opacity: draftUrl.trim() ? 1 : 0.45 }}>{justSaved ? "Saved!" : "Save URL"}</button>
            <button className="btn btn-ghost flex items-center gap-1.5 px-4 py-2.5 text-sm" onClick={handleSyncNow} disabled={!sheetUrl || syncing} style={{ opacity: !sheetUrl ? 0.45 : 1 }}>
              <RefreshCw size={15} className={syncing ? "animate-spin" : ""} /> {syncing ? "Syncing…" : "Sync now"}
            </button>
            <label className="flex items-center gap-2 text-sm ml-1" style={{ color: "var(--ink-soft)" }}>
              <input type="checkbox" checked={autoSync} onChange={(e) => setAutoSync(e.target.checked)} /> Auto-sync after every change
            </label>
          </div>
          <div className="text-xs fmono" style={{ color: "var(--ink-soft)" }}>{sheetUrl ? `Connected · last synced ${fmtDateTime(lastSynced)}` : "Not connected yet"}</div>

          {sheetUrl && (
            <div className="card p-3.5" style={{ background: "var(--teal-tint)", border: "none" }}>
              <div className="text-xs font-semibold mb-1" style={{ color: "var(--teal-dark)" }}>Use this link on every device</div>
              <div className="text-xs" style={{ color: "var(--ink-soft)" }}>
                Bookmark this exact link (not the plain one) on your other computers/phones. Any device that opens it already knows which sheet to use — new data pulls in automatically, no setup needed there.
              </div>
              <div className="flex gap-2 mt-2">
                <input readOnly className="input flex-1 px-3 py-2 text-xs fmono" value={typeof window !== "undefined" ? `${window.location.origin}${window.location.pathname}?sheet=${encodeURIComponent(sheetUrl)}` : ""} onClick={(e) => e.target.select()} />
                <button className="btn btn-primary flex items-center gap-1 px-3 py-2 text-xs shrink-0" onClick={async () => {
                  const link = `${window.location.origin}${window.location.pathname}?sheet=${encodeURIComponent(sheetUrl)}`;
                  try { await navigator.clipboard.writeText(link); setLinkCopied(true); setTimeout(() => setLinkCopied(false), 1800); } catch (e) {}
                }}>{linkCopied ? <Check size={13} /> : <Copy size={13} />} {linkCopied ? "Copied" : "Copy"}</button>
              </div>
            </div>
          )}

          {confirmEmptySync && (
            <div className="card p-4 flex flex-col gap-2.5" style={{ background: "var(--coral-tint)", border: "none" }}>
              <div className="text-sm flex items-start gap-2" style={{ color: "var(--coral)" }}>
                <AlertCircle size={18} className="shrink-0 mt-0.5" />
                <span>This device has <strong>0 students</strong> saved locally. Syncing now would overwrite the Google Sheet with empty data — this is exactly what caused data loss before. If you're setting this up fresh, that's fine. Otherwise, restore from the sheet first (below) instead.</span>
              </div>
              <div className="flex gap-2 justify-end">
                <button className="btn btn-ghost px-3 py-2 text-sm" onClick={() => setConfirmEmptySync(false)}>Cancel</button>
                <button className="btn px-3 py-2 text-sm" style={{ background: "var(--coral)", color: "white" }} onClick={handleConfirmedEmptySync}>Sync anyway (I mean it)</button>
              </div>
            </div>
          )}
        </div>
      </div>

      <div>
        <SectionTitle>Restore data from Google Sheet</SectionTitle>
        <div className="card p-4 flex flex-col gap-3">
          <div className="text-sm" style={{ color: "var(--ink-soft)" }}>
            Opening this app on a new device? Restore your data from the connected sheet before you do anything else — don't hit "Sync now" first.
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <button className="btn btn-primary flex items-center gap-1.5 px-4 py-2.5 text-sm" onClick={handleAutoRestore} disabled={!sheetUrl || restoring} style={{ opacity: !sheetUrl ? 0.45 : 1 }}>
              <RefreshCw size={15} className={restoring ? "animate-spin" : ""} /> {restoring ? "Restoring…" : "Try automatic restore"}
            </button>
            <button className="btn btn-ghost px-4 py-2.5 text-sm" onClick={() => sheetUrl && window.open(sheetUrl, "_blank")} disabled={!sheetUrl} style={{ opacity: !sheetUrl ? 0.45 : 1 }}>
              Open backup link
            </button>
            {restoredOk && <span className="text-xs fmono flex items-center gap-1" style={{ color: "var(--teal-dark)" }}><CheckCircle size={14} /> Restored!</span>}
          </div>
          {restoreError && (
            <div className="text-xs" style={{ color: "var(--coral)" }}>{restoreError}</div>
          )}
          <button className="text-xs font-semibold w-fit" style={{ color: "var(--teal-dark)", background: "none", border: "none" }} onClick={() => setShowPasteRestore((v) => !v)}>
            {showPasteRestore ? "Hide manual restore" : "Manual restore (paste backup text) →"}
          </button>
          {showPasteRestore && (
            <div className="flex flex-col gap-2">
              <div className="text-xs" style={{ color: "var(--ink-soft)" }}>
                Click "Open backup link" above — it opens the raw backup JSON in a new tab. Select all (Ctrl/Cmd+A), copy, and paste it below.
              </div>
              <textarea className="input w-full px-3 py-2.5 text-xs fmono" style={{ minHeight: 100 }} placeholder='{"students": [...], ...}' value={pasteText} onChange={(e) => setPasteText(e.target.value)} />
              <div className="flex flex-wrap gap-2">
                <button className="btn px-4 py-2.5 text-sm w-fit" style={{ background: "var(--teal)", color: "white", opacity: pasteText.trim() ? 1 : 0.45 }} onClick={() => handleImportPasted("merge")} disabled={!pasteText.trim()}>
                  Merge in (add only, keep existing)
                </button>
                <button className="btn btn-ghost px-4 py-2.5 text-sm w-fit" style={{ opacity: pasteText.trim() ? 1 : 0.45 }} onClick={() => handleImportPasted("replace")} disabled={!pasteText.trim()}>
                  Replace everything
                </button>
              </div>
              <div className="text-xs" style={{ color: "var(--ink-soft)" }}>
                Use <strong>Merge in</strong> to add missing students/packages without touching what's already here. Use <strong>Replace everything</strong> only when you want this device to exactly match the pasted backup.
              </div>
            </div>
          )}
        </div>
      </div>

      <div>
        <SectionTitle>One-time setup in Google Sheets</SectionTitle>
        <div className="card p-4 flex flex-col gap-3">
          {steps.map((s, i) => (
            <div key={i} className="flex gap-3">
              <div className="flex items-center justify-center rounded-full shrink-0 fmono text-xs font-semibold" style={{ width: 22, height: 22, background: "var(--teal-tint)", color: "var(--teal-dark)", marginTop: 1 }}>{i + 1}</div>
              <div><div className="text-sm font-semibold" style={{ color: "var(--ink)" }}>{s.title}</div><div className="text-sm" style={{ color: "var(--ink-soft)" }}>{s.body}</div></div>
            </div>
          ))}
          <div className="text-xs fmono" style={{ color: "var(--coral)" }}>
            Already deployed before? You need to redeploy: Deploy → Manage deployments → edit (pencil) → Version: New version → Deploy, so the updated code (with restore support) takes effect. The URL stays the same.
          </div>
        </div>
      </div>

      <div>
        <SectionTitle>Apps Script code to paste</SectionTitle>
        <div className="card p-0 overflow-hidden">
          <div className="flex items-center justify-between px-4 py-2.5" style={{ borderBottom: "1px solid var(--line)", background: "var(--teal-tint)" }}>
            <span className="text-xs font-semibold fmono" style={{ color: "var(--teal-dark)" }}>Code.gs</span>
            <button className="flex items-center gap-1.5 text-xs font-semibold" style={{ color: "var(--teal-dark)", background: "none", border: "none" }} onClick={handleCopy}>{copied ? <Check size={14} /> : <Copy size={14} />} {copied ? "Copied" : "Copy code"}</button>
          </div>
          <pre className="fmono text-xs p-4 overflow-x-auto" style={{ color: "var(--ink)", margin: 0, background: "var(--paper)" }}>{APPS_SCRIPT_CODE}</pre>
        </div>
        <a href="https://sheets.google.com" target="_blank" rel="noreferrer" className="flex items-center gap-1.5 text-sm font-medium mt-3 w-fit" style={{ color: "var(--teal-dark)" }}>Open Google Sheets <ExternalLink size={14} /></a>
      </div>
    </div>
  );
}

/* ---------- generic UI atoms ---------- */

function SectionTitle({ children }) { return <div className="text-sm font-semibold mb-2" style={{ color: "var(--ink-soft)" }}>{children}</div>; }

function ComboSelect({ value, onChange, options, onAddOption, placeholder }) {
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState("");

  if (adding) {
    return (
      <div className="flex gap-2">
        <input
          className="input flex-1 px-3 py-2.5 text-sm"
          placeholder={placeholder || "Type new value…"}
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              const v = draft.trim();
              if (!v) return;
              onAddOption(v);
              onChange(v);
              setDraft("");
              setAdding(false);
            }
          }}
          autoFocus
        />
        <button
          type="button"
          className="btn btn-primary px-3 py-2.5 text-sm"
          onClick={() => {
            const v = draft.trim();
            if (!v) return;
            onAddOption(v);
            onChange(v);
            setDraft("");
            setAdding(false);
          }}
        >
          Add
        </button>
        <button type="button" className="btn btn-ghost px-3 py-2.5 text-sm" onClick={() => { setAdding(false); setDraft(""); }}>
          <X size={15} />
        </button>
      </div>
    );
  }

  return (
    <select
      className="input w-full px-3 py-2.5 text-sm"
      value={options.includes(value) ? value : ""}
      onChange={(e) => {
        if (e.target.value === "__add_new__") setAdding(true);
        else onChange(e.target.value);
      }}
    >
      <option value="">Select…</option>
      {options.map((o) => <option key={o} value={o}>{o}</option>)}
      <option value="__add_new__">+ Add new…</option>
    </select>
  );
}

function Field({ label, children }) {
  return <label className="flex flex-col gap-1.5"><span className="text-xs font-semibold" style={{ color: "var(--ink-soft)" }}>{label}</span>{children}</label>;
}

function Modal({ title, children, onClose, wide }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(30,42,46,0.45)" }} onClick={onClose}>
      <div className="card w-full p-5" style={{ maxWidth: wide ? 480 : 400, maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="fdisplay" style={{ fontSize: 18, fontWeight: 700, color: "var(--ink)" }}>{title}</div>
          <button onClick={onClose} className="p-1 rounded-full" style={{ color: "var(--ink-soft)", background: "none", border: "none" }}><X size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
