<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef, useMemo } from "react";
import ReactDOM from "react-dom/client";
import * as XLSX from "xlsx";
import {
  Users, CalendarCheck, BookOpenCheck, BarChart3, Plus, X, Search,
  CreditCard, Wallet, Trash2, ChevronRight, ChevronLeft, AlertCircle, Loader2,
  ArrowLeft, CheckCircle2, Clock, Sun, SunMedium, GraduationCap,
  Download, FileSpreadsheet, ExternalLink, CheckCircle, RefreshCw,
  Copy, Check, Cloud, XCircle, Pencil
} from "lucide-react";

/* ---------- config ---------- */

const TYPE_CONFIG = {
  course:    { label: "Regular course",  unitName: "session",  defaultUnits: 10, hint: "1.5 hrs / session", icon: BookOpenCheck },
  camp_full: { label: "Full-day camp",    unitName: "day",       defaultUnits: 5,  hint: "Per day",          icon: Sun },
  camp_half: { label: "Half-day camp",    unitName: "half-day",  defaultUnits: 5,  hint: "Per half-day",     icon: SunMedium },
  workshop:  { label: "Workshop",         unitName: "hr",        defaultUnits: 3,  hint: "Per hour",         icon: Clock },
};

const CC_RATE = 0.03;
const STORAGE_KEY = "school-data";
const PENDING_PURCHASE_ID = "PENDING";
const CC_MONTHLY_MIN = 50000;
const CC_MONTHLY_SHORTFALL_FEE = 500;

const APPS_SCRIPT_CODE = `function doPost(e) {
  var payload = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();

  // Safety net: refuse to overwrite existing data with an empty sync
  // (e.g. syncing from a brand-new device before its local data is restored).
  var backupSheet = ss.getSheetByName('_Backup') || ss.insertSheet('_Backup');
  var existingRaw = backupSheet.getRange('A1').getValue();
  var existingCount = 0;
  if (existingRaw) {
    try { existingCount = (JSON.parse(existingRaw).students || []).length; } catch (parseErr) {}
  }
  var incomingCount = (payload.students || []).length;
  if (incomingCount === 0 && existingCount > 0) {
    return ContentService.createTextOutput('BLOCKED_EMPTY_OVERWRITE');
  }

  writeSheet(ss, 'Students',
    ['ID', 'Name', 'Phone', 'Note'],
    payload.students.map(function (s) { return [s.id, s.name, s.phone, s.note]; })
  );

  var purchaseHeaders = ['ID', 'Student', 'Subject', 'Type', 'Total Units', 'Bonus Units', 'Unit', 'List Price', 'Discount Type', 'Discount Value', 'Discount Amount',
     'Price Paid', 'Payment Method', 'CC Charged to Customer', 'CC Fee Cost (bank)', 'Customer Charged', 'School Net Revenue', 'Price / Unit',
     'Purchase Date', 'Used', 'Remaining'];
  var purchaseRow = function (p) {
    return [p.id, p.studentName, p.subject, p.type, p.totalUnits, p.bonusUnits, p.unitName,
      p.listPrice, p.discountType, p.discountValue, p.discountAmount, p.pricePaid, p.paymentMethod,
      p.ccChargeExtra, p.ccFeeCost, p.customerCharged, p.netRevenue, p.pricePerUnit,
      p.purchaseDate, p.used, p.remaining];
  };
  var activePurchases = payload.purchases.filter(function (p) { return p.remaining > 0; });
  var completedPurchases = payload.purchases.filter(function (p) { return p.remaining <= 0; });
  writeSheet(ss, 'Purchases', purchaseHeaders, activePurchases.map(purchaseRow));
  writeSheet(ss, 'Completed Packages', purchaseHeaders, completedPurchases.map(purchaseRow));

  writeSheet(ss, 'Attendance',
    ['Date', 'Student', 'Subject', 'Units Used', 'Unit', 'Teacher', 'Attended', 'Note'],
    payload.attendance.map(function (a) {
      return [a.date, a.studentName, a.subject, a.unitsUsed, a.unitName, a.teacher, a.attended, a.note];
    })
  );

  writeSheet(ss, 'Registration Fees',
    ['Student', 'Amount', 'Status', 'Date', 'Note'],
    payload.registrationFees.map(function (r) {
      return [r.studentName, r.amount, r.status, r.date, r.note];
    })
  );

  // Full raw snapshot for restore — this is what "Restore from Google Sheet" reads back.
  backupSheet.getRange('A1').setValue(payload.rawState || '');
  try { backupSheet.hideSheet(); } catch (hideErr) {}

  return ContentService.createTextOutput('OK');
}

function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var backupSheet = ss.getSheetByName('_Backup');
  var raw = backupSheet ? backupSheet.getRange('A1').getValue() : '';
  return ContentService.createTextOutput(raw || '{}').setMimeType(ContentService.MimeType.JSON);
}

function writeSheet(ss, name, headers, rows) {
  var sheet = ss.getSheetByName(name);
  if (!sheet) sheet = ss.insertSheet(name);
  sheet.clear();
  sheet.appendRow(headers);
  if (rows.length) sheet.getRange(2, 1, rows.length, headers.length).setValues(rows);
  sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold');
  sheet.autoResizeColumns(1, headers.length);
}`;

/* ---------- local storage helpers (this app now runs as a normal
   website, so it uses the browser's own localStorage — data lives
   in this browser only, unless you also sync to a Google Sheet) --- */

function storageGet(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? { value: v } : null;
  } catch (e) {
    return null;
  }
}
function storageSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return { key, value };
  } catch (e) {
    return null;
  }
}

// Pulls the full raw data snapshot back from the connected Google Sheet.
// Used both for the manual "restore" button and automatically on load
// for a device that doesn't have any local data yet.
async function restoreFromSheet(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (!data || (!data.students && !data.purchases)) throw new Error("empty backup");
  return data;
}

/* ---------- helpers ---------- */

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtBaht = (n) => "฿" + Math.round(n || 0).toLocaleString("en-US");
const fmtNum = (n) => (Math.round(n * 100) / 100).toLocaleString("en-US");
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) =>
  new Date(d + "T00:00:00").toLocaleDateString("en-US", { day: "numeric", month: "short", year: "2-digit" });
const fmtDateTime = (ts) =>
  ts ? new Date(ts).toLocaleString("en-US", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "never";

function ccFeeOf(price, method) {
  return method === "credit" ? price * CC_RATE : 0;
}

// The 3% card-network fee is a cost the school owes the bank — never course revenue.
// chargeExtra = true: customer pays price+3% themselves, fee is a pure pass-through (school nets full price).
// chargeExtra = false: customer pays price only, school absorbs the 3% out of that price (school nets price*0.97).
// Older saved purchases have no ccChargeExtra field — default them to true to match original behavior.
function ccBreakdown(p) {
  if (p.paymentMethod !== "credit") {
    return { feeCost: 0, customerCharged: p.pricePaid, netRevenue: p.pricePaid, chargeExtra: false };
  }
  const chargeExtra = p.ccChargeExtra !== false;
  const feeCost = p.pricePaid * CC_RATE;
  return {
    feeCost,
    customerCharged: chargeExtra ? p.pricePaid + feeCost : p.pricePaid,
    netRevenue: chargeExtra ? p.pricePaid : p.pricePaid - feeCost,
    chargeExtra,
  };
}

// Price per class should spread the net revenue across every class actually
// delivered — paid classes AND any bonus/free classes given with the package.
// e.g. 8 paid + 1 bonus at ฿12,600 → ฿12,600 / 9 per class, not / 8.
function netPricePerUnit(p) {
  const capacity = (p.totalUnits || 0) + (p.bonusUnits || 0);
  if (!capacity) return 0;
  return ccBreakdown(p).netRevenue / capacity;
}
function describeFeeStatus(r) {
  if (!r) return "";
  if (r.status === "waived") return "Waived";
  if (r.status === "credit") return r.creditUsedInPurchaseId ? "Collected, credit already used" : "Collected, credit available";
  return "Collected";
}

/* ---------- root ---------- */

function App() {
  const [loading, setLoading] = useState(true);
  const [students, setStudents] = useState([]);
  const [purchases, setPurchases] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [subjects, setSubjects] = useState([]);
  const [teachers, setTeachers] = useState([]);
  const [registrationFees, setRegistrationFees] = useState([]);
  const [sheetUrl, setSheetUrl] = useState("");
  const [autoSync, setAutoSync] = useState(false);
  const [lastSynced, setLastSynced] = useState(null);
  const [remoteMismatch, setRemoteMismatch] = useState(null);
  const [tab, setTab] = useState("checkin");
  const [selectedStudentId, setSelectedStudentId] = useState(null);
  const loadedRef = useRef(false);

  useEffect(() => {
    (async () => {
      const res = storageGet(STORAGE_KEY);
      let data = {};
      if (res && res.value) {
        try { data = JSON.parse(res.value); } catch (e) {}
      }
      let urlSheet = "";
      try {
        urlSheet = new URLSearchParams(window.location.search).get("sheet") || "";
      } catch (e) {}
      const effectiveSheetUrl = data.sheetUrl || urlSheet || "";

      let finalStudents = data.students || [];
      let finalPurchases = data.purchases || [];
      let finalAttendance = data.attendance || [];
      let finalSubjects = data.subjects || [];
      let finalTeachers = data.teachers || [];
      let finalFees = data.registrationFees || [];

      // Brand-new / empty device that already knows the sheet (via saved URL or a shared link)
      // pulls the existing data automatically — no manual restore button needed.
      const isEmpty = finalStudents.length === 0;
      if (isEmpty && effectiveSheetUrl) {
        try {
          const remote = await restoreFromSheet(effectiveSheetUrl);
          if (remote.students && remote.students.length) {
            finalStudents = remote.students || [];
            finalPurchases = remote.purchases || [];
            finalAttendance = remote.attendance || [];
            finalSubjects = remote.subjects || [];
            finalTeachers = remote.teachers || [];
            finalFees = remote.registrationFees || [];
          }
        } catch (e) {
          // no network / sheet not reachable yet — fall back to manual restore in the Backup tab
        }
      }

      // Already has local data — don't overwrite silently, but check in the
      // background whether the sheet has different students, packages, or
      // check-ins than this device, and surface a banner. Checking all three
      // counts (not just students) catches far more real-world edits — e.g.
      // adding a package or a check-in on another device without adding a
      // new student wouldn't change the student count at all.
      if (!isEmpty && effectiveSheetUrl) {
        restoreFromSheet(effectiveSheetUrl)
          .then((remote) => {
            const remoteCounts = {
              students: (remote.students || []).length,
              purchases: (remote.purchases || []).length,
              attendance: (remote.attendance || []).length,
            };
            const localCounts = {
              students: finalStudents.length,
              purchases: finalPurchases.length,
              attendance: finalAttendance.length,
            };
            if (
              remoteCounts.students !== localCounts.students ||
              remoteCounts.purchases !== localCounts.purchases ||
              remoteCounts.attendance !== localCounts.attendance
            ) {
              setRemoteMismatch({ remote: remoteCounts, local: localCounts });
            }
          })
          .catch(() => {});
      }

      const subjSet = new Set(finalSubjects);
      finalPurchases.forEach((p) => p.subject && subjSet.add(p.subject));
      const teachSet = new Set(finalTeachers);
      finalAttendance.forEach((a) => a.teacher && teachSet.add(a.teacher));

      const finalAutoSync = data.autoSync !== undefined ? !!data.autoSync : !!effectiveSheetUrl;

      setStudents(finalStudents);
      setPurchases(finalPurchases);
      setAttendance(finalAttendance);
      setSubjects(Array.from(subjSet));
      setTeachers(Array.from(teachSet));
      setRegistrationFees(finalFees);
      setSheetUrl(effectiveSheetUrl);
      setAutoSync(finalAutoSync);
      setLastSynced(data.lastSynced || null);

      storageSet(STORAGE_KEY, JSON.stringify({
        students: finalStudents, purchases: finalPurchases, attendance: finalAttendance,
        subjects: Array.from(subjSet), teachers: Array.from(teachSet), registrationFees: finalFees,
        sheetUrl: effectiveSheetUrl, autoSync: finalAutoSync, lastSynced: data.lastSynced || null,
      }));

      loadedRef.current = true;
      setLoading(false);
    })();
  }, []);

  useEffect(() => {
    if (!loadedRef.current) return;
    const t = setTimeout(() => {
      storageSet(STORAGE_KEY, JSON.stringify({ students, purchases, attendance, subjects, teachers, registrationFees, sheetUrl, autoSync, lastSynced }));
      if (autoSync && sheetUrl) doSync();
    }, 350);
    return () => clearTimeout(t);
    // eslint-disable-next-line
  }, [students, purchases, attendance, subjects, teachers, registrationFees]);

  const purchasesByStudent = useMemo(() => {
    const m = {};
    purchases.forEach((p) => {
      (p.studentIds || [p.studentId]).forEach((sid) => { (m[sid] ||= []).push(p); });
    });
    return m;
  }, [purchases]);

  const usedUnitsByPurchase = useMemo(() => {
    const m = {};
    attendance.forEach((a) => { m[a.purchaseId] = (m[a.purchaseId] || 0) + a.unitsUsed; });
    return m;
  }, [attendance]);

  function capacityOf(p) {
    return p.totalUnits + (p.bonusUnits || 0);
  }
  function remainingOf(p) {
    return Math.max(0, capacityOf(p) - (usedUnitsByPurchase[p.id] || 0));
  }
  function studentName(id) {
    return students.find((s) => s.id === id)?.name || "—";
  }

  async function pullFromSheet() {
    if (!sheetUrl) return false;
    try {
      const remote = await restoreFromSheet(sheetUrl);
      setStudents(remote.students || []);
      setPurchases(remote.purchases || []);
      setAttendance(remote.attendance || []);
      setSubjects(remote.subjects || []);
      setTeachers(remote.teachers || []);
      setRegistrationFees(remote.registrationFees || []);
      setRemoteMismatch(null);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function doSync(skipEmptyGuard) {
    if (!sheetUrl) return false;
    if (!skipEmptyGuard && students.length === 0) {
      return "EMPTY_GUARD";
    }
    const rawState = JSON.stringify({ students, purchases, attendance, subjects, teachers, registrationFees });
    const payload = {
      generatedAt: new Date().toISOString(),
      rawState,
      students: students.map((s) => ({ id: s.id, name: s.name, phone: s.phone || "", note: s.note || "" })),
      purchases: purchases.map((p) => {
        const cfg = TYPE_CONFIG[p.type];
        const cc = ccBreakdown(p);
        const used = usedUnitsByPurchase[p.id] || 0;
        const names = (p.studentIds || [p.studentId]).map(studentName).join(" & ");
        return {
          id: p.id, studentName: names, subject: p.subject, type: cfg.label,
          totalUnits: p.totalUnits, bonusUnits: p.bonusUnits || 0, unitName: cfg.unitName,
          listPrice: p.listPrice != null ? p.listPrice : p.pricePaid,
          discountType: p.discountType || "amount", discountValue: p.discountValue || 0, discountAmount: p.discountAmount || p.discount || 0,
          pricePaid: p.pricePaid, paymentMethod: p.paymentMethod,
          ccChargeExtra: cc.chargeExtra, ccFeeCost: Math.round(cc.feeCost), customerCharged: Math.round(cc.customerCharged), netRevenue: Math.round(cc.netRevenue),
          pricePerUnit: Math.round(netPricePerUnit(p) * 100) / 100,
          purchaseDate: p.purchaseDate, used, remaining: Math.max(0, capacityOf(p) - used),
        };
      }),
      attendance: attendance.map((a) => {
        const p = purchases.find((x) => x.id === a.purchaseId);
        return {
          date: a.date, studentName: studentName(a.studentId), subject: p?.subject || "",
          unitsUsed: a.unitsUsed, unitName: p ? TYPE_CONFIG[p.type].unitName : "",
          teacher: a.teacher || "", attended: a.attended === false ? "No (charged)" : "Yes", note: a.note || "",
        };
      }),
      registrationFees: registrationFees.map((r) => ({
        studentName: studentName(r.studentId), amount: r.amount, status: r.status, date: r.date, note: r.note || "",
      })),
    };
    try {
      await fetch(sheetUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
      const now = Date.now();
      setLastSynced(now);
      storageSet(STORAGE_KEY, JSON.stringify({ students, purchases, attendance, subjects, teachers, registrationFees, sheetUrl, autoSync, lastSynced: now }));
      return true;
    } catch (e) {
      return false;
    }
  }

  const ctx = {
    students, setStudents, purchases, setPurchases, attendance, setAttendance,
    subjects, setSubjects, teachers, setTeachers, registrationFees, setRegistrationFees,
    purchasesByStudent, usedUnitsByPurchase, remainingOf, capacityOf, studentName,
    selectedStudentId, setSelectedStudentId, setTab,
    sheetUrl, setSheetUrl, autoSync, setAutoSync, lastSynced, doSync,
    remoteMismatch, setRemoteMismatch, pullFromSheet,
  };

  if (loading) {
    return (
      <div className="w-full min-h-screen flex items-center justify-center" style={{ background: "var(--bg)" }}>
        <GlobalStyle />
        <div className="flex flex-col items-center gap-3" style={{ color: "var(--ink-soft)" }}>
          <Loader2 className="animate-spin" size={28} />
          <div style={{ fontFamily: "var(--font-body)" }}>Loading data…</div>
        </div>
      </div>
    );
  }

  return (
    <div className="w-full min-h-screen" style={{ background: "var(--bg)", fontFamily: "var(--font-body)" }}>
      <GlobalStyle />
      <Header tab={tab} setTab={setTab} />
      {remoteMismatch && (
        <div className="max-w-5xl mx-auto px-4 pt-4">
          <div className="card p-3.5 flex flex-wrap items-center justify-between gap-3" style={{ background: "var(--amber-tint)", border: "none" }}>
            <div className="text-sm flex items-start gap-2" style={{ color: "#5A4118" }}>
              <AlertCircle size={17} className="shrink-0 mt-0.5" />
              <span>
                This device doesn't match the connected Google Sheet.
                {" "}This device: <strong>{remoteMismatch.local.students} students, {remoteMismatch.local.purchases} packages, {remoteMismatch.local.attendance} check-ins</strong>.
                {" "}Sheet: <strong>{remoteMismatch.remote.students} students, {remoteMismatch.remote.purchases} packages, {remoteMismatch.remote.attendance} check-ins</strong>.
                {" "}One of them is out of date — check which one has the data you expect before deciding.
              </span>
            </div>
            <div className="flex gap-2 shrink-0">
              <button className="btn btn-ghost px-3 py-2 text-sm" onClick={() => setRemoteMismatch(null)}>Dismiss</button>
              <button className="btn px-3 py-2 text-sm" style={{ background: "#92651A", color: "white" }} onClick={pullFromSheet}>Use sheet's data</button>
            </div>
          </div>
        </div>
      )}
      <main className="max-w-5xl mx-auto px-4 pb-16 pt-5">
        {tab === "checkin" && <CheckInView {...ctx} />}
        {tab === "students" && <StudentsView {...ctx} />}
        {tab === "purchases" && <PurchasesView {...ctx} />}
        {tab === "reports" && <ReportsView {...ctx} />}
        {tab === "backup" && <BackupView {...ctx} />}
      </main>
    </div>
  );
}

/* ---------- style ---------- */

function GlobalStyle() {
  return (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
      *{ box-sizing: border-box; }

        --amber: #DE9A34; --amber-tint: #FBF0DC; --coral: #C15A4F; --coral-tint: #F7E7E4;

      }
      body { font-family: var(--font-body); }

      .fmono{ font-family: var(--font-mono); }
      .w-full{width:100%} .min-h-screen{min-height:100vh} .flex{display:flex} .flex-col{flex-direction:column}
      .items-center{align-items:center} .justify-center{justify-content:center} .justify-between{justify-content:space-between}
      .gap-1{gap:4px} .gap-1\\.5{gap:6px} .gap-2{gap:8px} .gap-2\\.5{gap:10px} .gap-3{gap:12px} .gap-3\\.5{gap:14px} .gap-4{gap:16px} .gap-5{gap:20px}
      .flex-wrap{flex-wrap:wrap} .flex-1{flex:1 1 0%} .shrink-0{flex-shrink:0} .min-w-0{min-width:0}
      .text-center{text-align:center} .text-left{text-align:left} .relative{position:relative} .fixed{position:fixed}
      .inset-0{top:0;right:0;bottom:0;left:0} .z-50{z-index:50} .overflow-hidden{overflow:hidden} .overflow-y-auto{overflow-y:auto} .overflow-x-auto{overflow-x:auto}
      .rounded-full{border-radius:9999px} .rounded-lg{border-radius:10px} .rounded-xl{border-radius:14px}
      .font-semibold{font-weight:600} .font-medium{font-weight:500} .font-bold{font-weight:700}
      .text-xs{font-size:12px} .text-sm{font-size:14px} .text-base{font-size:16px}
      .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .grid{display:grid} .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
      .divide-y > * + *{border-top:1px solid var(--line)}

    { id: "purchases", label: "Packages", icon: BookOpenCheck },

    <div style={{ background: "var(--paper)", borderBottom: "1px solid var(--line)" }}>

          </div>

            <div className="fdisplay" style={{ fontSize: 21, fontWeight: 700, color: "var(--ink)", lineHeight: 1.1 }}>Student Manager</div>

/* ---------- shared bits ---------- */

function Empty({ icon: Icon, title, sub }) {
  return (
    <div className="card flex flex-col items-center justify-center text-center" style={{ padding: "56px 24px" }}>
      <div className="flex items-center justify-center rounded-full mb-3" style={{ width: 52, height: 52, background: "var(--teal-tint)", color: "var(--teal-dark)" }}>
        <Icon size={24} />
      </div>
      <div className="font-semibold" style={{ color: "var(--ink)" }}>{title}</div>
      {sub && <div className="text-sm mt-1" style={{ color: "var(--ink-soft)", maxWidth: 320 }}>{sub}</div>}
    </div>
  );
}

function RemainingBadge({ remaining, total, unitName }) {
  let bg = "var(--teal-tint)", color = "var(--teal-dark)";
  if (remaining === 0) { bg = "var(--coral-tint)"; color = "var(--coral)"; }
  else if (remaining <= Math.max(1, Math.round(total * 0.2))) { bg = "var(--amber-tint)"; color = "#92651A"; }
  return (
    <span className="badge fmono" style={{ background: bg, color }}>
      {fmtNum(remaining)}/{fmtNum(total)} {unitName}{remaining !== 1 ? "s" : ""} left
    </span>
  );
}

function TypeIcon({ type, size = 15 }) {
  const Icon = TYPE_CONFIG[type]?.icon || BookOpenCheck;
  return <Icon size={size} />;
}

/* =========================================================
   CHECK-IN VIEW
   ========================================================= */

function CheckInView({ students, purchases, attendance, setAttendance, purchasesByStudent, remainingOf, studentName, setTab, teachers, setTeachers }) {
  const [date, setDate] = useState(todayStr());
  const [adding, setAdding] = useState(false);
  const [justStamped, setJustStamped] = useState(null);
  const [editingAttendance, setEditingAttendance] = useState(null);

  const todays = attendance.filter((a) => a.date === date).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  function removeEntry(id) {
    setAttendance((prev) => prev.filter((a) => a.id !== id));
  }
  function updateAttendance(id, fields) {
    setAttendance((prev) => prev.map((a) => (a.id === id ? { ...a, ...fields } : a)));
  }

  return (
    <div className="flex flex-col gap-4">
      <div className="card p-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <div className="text-xs font-semibold" style={{ color: "var(--ink-soft)" }}>Check-in date</div>
          <input type="date" className="input fmono text-sm px-3 py-1.5 mt-1" value={date} onChange={(e) => setDate(e.target.value)} />
        </div>
        <button className="btn btn-primary flex items-center gap-1.5 px-4 py-2.5 text-sm" onClick={() => setAdding(true)}>
          <Plus size={17} /> Check in a student
        </button>
      </div>

      {students.length === 0 && <Empty icon={Users} title="No students yet" sub="Add your first student on the Students tab" />}
      {students.length > 0 && todays.length === 0 && (
        <Empty icon={CalendarCheck} title="No check-ins yet today" sub={`Tap "Check in a student" to record who came on ${fmtDate(date)}`} />
      )}

      <div className="flex flex-col gap-2.5">
        {todays.map((a) => {
          const p = purchases.find((x) => x.id === a.purchaseId);
          return (
            <div key={a.id} className={`card p-3.5 flex items-center justify-between gap-3 ${justStamped === a.id ? "stamp-pop" : ""}`} style={a.attended === false ? { background: "var(--amber-tint)", border: "none" } : a.isAdvance ? { background: "var(--coral-tint)", border: "none" } : {}}>
              <div className="flex items-center gap-3 min-w-0">
                <div className="flex items-center justify-center rounded-full shrink-0" style={{ width: 36, height: 36, background: a.attended === false ? "var(--amber)" : a.isAdvance ? "var(--coral)" : "var(--teal)", color: "white" }}>
                  {a.attended === false ? <XCircle size={18} /> : <CheckCircle2 size={18} />}
                </div>
                <div className="min-w-0">
                  <div className="font-semibold truncate" style={{ color: "var(--ink)" }}>{studentName(a.studentId)}</div>
                  <div className="text-xs flex items-center gap-1.5 mt-0.5" style={{ color: a.attended === false ? "#92651A" : "var(--ink-soft)" }}>
                    <TypeIcon type={p?.type} size={13} />
                    {p ? `${p.subject} · used ${fmtNum(a.unitsUsed)} ${TYPE_CONFIG[p.type].unitName}${a.unitsUsed !== 1 ? "s" : ""}` : (a.isAdvance ? `Advance — owes ${fmtNum(a.unitsUsed)} class${a.unitsUsed !== 1 ? "es" : ""}, no package yet` : "Package not found")}
                    {a.teacher ? ` · Teacher: ${a.teacher}` : ""}
                    {a.isBonus ? " · free bonus class" : ""}
                    {a.attended === false ? " · charged, did not attend" : ""}
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-1">
                <button className="p-1.5" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => setEditingAttendance(a)} title="Edit"><Pencil size={15} /></button>
                <button className="btn-danger p-1.5" onClick={() => removeEntry(a.id)} title="Remove this entry"><Trash2 size={16} /></button>
              </div>
            </div>
          );
        })}
      </div>

      {adding && (
        <CheckInModal
          date={date} students={students} purchasesByStudent={purchasesByStudent} remainingOf={remainingOf}
          teachers={teachers} setTeachers={setTeachers}
          onClose={() => setAdding(false)}
          onGotoPurchases={() => { setAdding(false); setTab("purchases"); }}
          onSubmit={(entry) => {
            const id = uid();
            setAttendance((prev) => [...prev, { ...entry, id, date, createdAt: Date.now() }]);
            setAdding(false);
            setJustStamped(id);
            setTimeout(() => setJustStamped(null), 500);
          }}
        />
      )}

      {editingAttendance && (
        <Modal onClose={() => setEditingAttendance(null)} title="Edit check-in">
          <EditAttendanceForm
            entry={editingAttendance}
            purchase={purchases.find((p) => p.id === editingAttendance.purchaseId)}
            teachers={teachers}
            onCancel={() => setEditingAttendance(null)}
            onSave={(fields) => { updateAttendance(editingAttendance.id, fields); setEditingAttendance(null); }}
          />
        </Modal>
      )}
    </div>
  );
}

function CheckInModal({ date, students, purchasesByStudent, remainingOf, teachers, setTeachers, onClose, onSubmit, onGotoPurchases }) {
  const HOURS_PER_SESSION = 1.5;
  const [query, setQuery] = useState("");
  const [studentId, setStudentId] = useState(null);
  const [purchaseId, setPurchaseId] = useState(null);
  const [units, setUnits] = useState(1);
  const [teacher, setTeacher] = useState("");
  const [note, setNote] = useState("");
  const [attended, setAttended] = useState(true);
  const [useBonus, setUseBonus] = useState(false);
  const [advanceMode, setAdvanceMode] = useState(false);
  function addTeacherOption(v) {
    setTeachers((prev) => (prev.includes(v) ? prev : [...prev, v]));
  }

  const filtered = students.filter((s) => s.name.toLowerCase().includes(query.toLowerCase()));
  const activePurchases = studentId ? (purchasesByStudent[studentId] || []).filter((p) => remainingOf(p) > 0) : [];
  const chosen = activePurchases.find((p) => p.id === purchaseId);

  useEffect(() => { setPurchaseId(null); setAdvanceMode(false); }, [studentId]);
  useEffect(() => { if (chosen) setUnits(1); setUseBonus(false); }, [purchaseId]);

  return (
    <Modal onClose={onClose} title="Check in a student" wide>
      <div className="flex flex-col gap-4">
        {!studentId ? (
          <div>
            <div className="relative">
              <Search size={16} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "var(--ink-soft)" }} />
              <input className="input w-full text-sm" style={{ paddingLeft: 36, paddingRight: 12, paddingTop: 10, paddingBottom: 10 }} placeholder="Search student name…" value={query} onChange={(e) => setQuery(e.target.value)} autoFocus />
            </div>
            <div className="flex flex-col gap-1.5 mt-3" style={{ maxHeight: 256, overflowY: "auto" }}>
              {filtered.length === 0 && <div className="text-sm text-center" style={{ color: "var(--ink-soft)", padding: "24px 0" }}>No students found</div>}
              {filtered.map((s) => (
                <button key={s.id} onClick={() => setStudentId(s.id)} className="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left" style={{ border: "1px solid var(--line)", background: "transparent" }}>
                  <span className="font-medium" style={{ color: "var(--ink)" }}>{s.name}</span>
                  <ChevronRight size={16} style={{ color: "var(--ink-soft)" }} />
                </button>
              ))}
            </div>
          </div>
        ) : (
          <>
            <button className="flex items-center gap-1 text-sm font-medium w-fit" style={{ color: "var(--teal-dark)", background: "none", border: "none" }} onClick={() => setStudentId(null)}>
              <ArrowLeft size={14} /> Change student
            </button>
            <div className="text-sm" style={{ color: "var(--ink-soft)" }}>Student</div>
            <div className="fdisplay -mt-3" style={{ fontSize: 19, fontWeight: 600, color: "var(--ink)" }}>{students.find((s) => s.id === studentId)?.name}</div>

            {activePurchases.length === 0 && !advanceMode ? (
              <div className="card p-4 flex items-start gap-2.5" style={{ background: "var(--amber-tint)", border: "none" }}>
                <AlertCircle size={18} style={{ color: "#92651A" }} className="shrink-0 mt-0.5" />
                <div className="text-sm" style={{ color: "#5A4118" }}>
                  This student has no packages with remaining sessions.
                  <button className="font-semibold underline block mt-1" style={{ background: "none", border: "none", color: "#5A4118" }} onClick={onGotoPurchases}>Go add a package →</button>
                  <button className="font-semibold underline block mt-1" style={{ background: "none", border: "none", color: "#5A4118" }} onClick={() => setAdvanceMode(true)}>Check in anyway — carry over as a debt →</button>
                </div>
              </div>
            ) : activePurchases.length === 0 && advanceMode ? (
              <div className="flex flex-col gap-3">
                <div className="card p-4 flex items-start gap-2.5" style={{ background: "var(--amber-tint)", border: "none" }}>
                  <AlertCircle size={18} style={{ color: "#92651A" }} className="shrink-0 mt-0.5" />
                  <div className="text-sm" style={{ color: "#5A4118" }}>
                    They'll attend today without an active package. This is logged as classes owed; it deducts automatically from whichever package they buy next.
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink-soft)" }}>Classes owed</div>
                    <input type="number" min="0.5" step="0.5" className="input w-full px-3 py-2 text-sm fmono" value={units} onChange={(e) => setUnits(Number(e.target.value))} />
                  </div>
                  <div>
                    <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink-soft)" }}>Note (optional)</div>
                    <input className="input w-full px-3 py-2 text-sm" value={note} onChange={(e) => setNote(e.target.value)} placeholder="e.g. waiting on renewal payment" />
                  </div>
                </div>
              </div>
            ) : (
              <div>
                <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink-soft)" }}>Choose a package to use</div>
                <div className="flex flex-col gap-2">
                  {activePurchases.map((p) => {
                    const rem = remainingOf(p);
                    return (
                      <button key={p.id} onClick={() => setPurchaseId(p.id)} className="flex items-center justify-between px-3.5 py-2.5 rounded-lg text-left"
                        style={{ border: purchaseId === p.id ? "2px solid var(--teal)" : "1px solid var(--line)", background: purchaseId === p.id ? "var(--teal-tint)" : "transparent" }}>
                        <div className="flex items-center gap-2 min-w-0">
                          <TypeIcon type={p.type} />
                          <div className="min-w-0">
                            <div className="font-medium truncate" style={{ color: "var(--ink)" }}>{p.subject}</div>
                            <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{TYPE_CONFIG[p.type].label}</div>
                          </div>
                        </div>
                        <RemainingBadge remaining={rem} total={p.totalUnits + (p.bonusUnits || 0)} unitName={TYPE_CONFIG[p.type].unitName} />
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {chosen && (
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink-soft)" }}>Units used ({TYPE_CONFIG[chosen.type].unitName})</div>
                  <input type="number" min="0.5" step="0.5" max={remainingOf(chosen)} className="input w-full px-3 py-2 text-sm fmono" value={units} onChange={(e) => setUnits(Number(e.target.value))} />
                  {chosen.type === "course" && (
                    <div className="text-xs fmono mt-1" style={{ color: "var(--ink-soft)" }}>≈ {fmtNum(units * HOURS_PER_SESSION)} hrs (standard session = {HOURS_PER_SESSION} hrs)</div>
                  )}
                </div>
                {chosen.type === "course" && (
                  <div>
                    <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink-soft)" }}>Or enter hours attended</div>
                    <input type="number" min="0.25" step="0.25" className="input w-full px-3 py-2 text-sm fmono" placeholder="e.g. 2"
                      onChange={(e) => { const h = Number(e.target.value); if (h > 0) setUnits(Math.round((h / HOURS_PER_SESSION) * 100) / 100); }} />
                    <div className="text-xs fmono mt-1" style={{ color: "var(--ink-soft)" }}>e.g. 2 hrs → {fmtNum(Math.round((2 / HOURS_PER_SESSION) * 100) / 100)} sessions</div>
                  </div>
                )}
                <div>
                  <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink-soft)" }}>Note (optional)</div>
                  <input className="input w-full px-3 py-2 text-sm" value={note} onChange={(e) => setNote(e.target.value)} placeholder="e.g. arrived late" />
                </div>
                <div>
                  <div className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink-soft)" }}>Teacher (optional)</div>
                  <ComboSelect value={teacher} onChange={setTeacher} options={teachers} onAddOption={addTeacherOption} placeholder="Teacher name" />
                </div>
                <div style={{ gridColumn: "1 / -1" }}>
                  <label className="flex items-start gap-2 text-sm card p-3" style={{ background: attended ? "transparent" : "var(--amber-tint)", cursor: "pointer" }}>
                    <input type="checkbox" checked={!attended} onChange={(e) => setAttended(!e.target.checked)} style={{ marginTop: 2 }} />
                    <span style={{ color: attended ? "var(--ink-soft)" : "#5A4118" }}>
                      Charged but did not attend <span className="fmono" style={{ opacity: 0.8 }}>(no-show / over makeup limit — still deducts a class, marked as unattended)</span>
                    </span>
                  </label>
                </div>
                {(chosen.bonusUnits || 0) > 0 && (
                  <div style={{ gridColumn: "1 / -1" }}>
                    <label className="flex items-start gap-2 text-sm card p-3" style={{ background: useBonus ? "var(--teal-tint)" : "transparent", cursor: "pointer" }}>
                      <input type="checkbox" checked={useBonus} onChange={(e) => setUseBonus(e.target.checked)} style={{ marginTop: 2 }} />
                      <span style={{ color: useBonus ? "var(--teal-dark)" : "var(--ink-soft)" }}>
                        Use a free bonus class today <span className="fmono" style={{ opacity: 0.8 }}>(this package has {fmtNum(chosen.bonusUnits)} bonus {TYPE_CONFIG[chosen.type].unitName}{chosen.bonusUnits !== 1 ? "s" : ""} — marks today as free, for your records)</span>
                      </span>
                    </label>
                  </div>
                )}
              </div>
            )}
          </>
        )}

        <div className="flex justify-end gap-2 pt-1">
          <button className="btn btn-ghost px-4 py-2.5 text-sm" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary px-5 py-2.5 text-sm"
            disabled={advanceMode ? (!units || units <= 0) : (!chosen || !units || units <= 0)}
            style={{ opacity: (advanceMode ? (!units || units <= 0) : (!chosen || !units || units <= 0)) ? 0.45 : 1 }}
            onClick={() =>
              advanceMode
                ? onSubmit({ studentId, purchaseId: PENDING_PURCHASE_ID, unitsUsed: Number(units), teacher: "", attended: true, isAdvance: true, note })
                : onSubmit({ studentId, purchaseId: chosen.id, unitsUsed: Number(units), teacher, attended, isBonus: useBonus, note })
            }>
            Save check-in
          </button>
        </div>
      </div>
    </Modal>
  );
}

/* =========================================================
   STUDENTS VIEW
   ========================================================= */

function StudentsView(props) {
  const { students, selectedStudentId, setSelectedStudentId } = props;
  if (selectedStudentId) {
    const s = students.find((x) => x.id === selectedStudentId);
    if (s) return <StudentProfile student={s} {...props} />;
    setSelectedStudentId(null);
  }
  return <StudentsList {...props} />;
}

function StudentsList({ students, setStudents, purchasesByStudent, remainingOf, setSelectedStudentId }) {
  const [query, setQuery] = useState("");
  const [adding, setAdding] = useState(false);
  const filtered = students.filter((s) => s.name.toLowerCase().includes(query.toLowerCase())).sort((a, b) => a.name.localeCompare(b.name));

  return (
    <div className="flex flex-col gap-4">
      <div className="flex flex-wrap gap-3 items-center justify-between">
        <div className="relative flex-1" style={{ minWidth: 220 }}>
          <Search size={16} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: "var(--ink-soft)" }} />
          <input className="input w-full text-sm" style={{ paddingLeft: 36, paddingRight: 12, paddingTop: 10, paddingBottom: 10 }} placeholder="Search students…" value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
        <button className="btn btn-primary flex items-center gap-1.5 px-4 py-2.5 text-sm shrink-0" onClick={() => setAdding(true)}><Plus size={17} /> Add student</button>
      </div>

      {students.length === 0 && <Empty icon={Users} title="No students yet" sub="Add your first student to get started" />}

      <div className="grid gap-2.5" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))" }}>
        {filtered.map((s) => {
          const ps = purchasesByStudent[s.id] || [];
          const activeCount = ps.filter((p) => remainingOf(p) > 0).length;
          return (
            <button key={s.id} className="card p-4 text-left flex flex-col gap-2" style={{ background: "var(--paper)" }} onClick={() => setSelectedStudentId(s.id)}>
              <div className="flex items-center justify-between">
                <div className="font-semibold" style={{ color: "var(--ink)" }}>{s.name}</div>
                <ChevronRight size={16} style={{ color: "var(--ink-soft)" }} />
              </div>
              {s.phone && <div className="text-xs fmono" style={{ color: "var(--ink-soft)" }}>{s.phone}</div>}
              <div className="text-xs mt-1" style={{ color: activeCount ? "var(--teal-dark)" : "var(--ink-soft)" }}>
                {ps.length === 0 ? "No packages yet" : `${activeCount} active · ${ps.length} total`}
              </div>
            </button>
          );
        })}
      </div>

      {adding && (
        <Modal onClose={() => setAdding(false)} title="Add a new student">
          <AddStudentForm onCancel={() => setAdding(false)} onSave={(s) => { const id = uid(); setStudents((prev) => [...prev, { ...s, id }]); setAdding(false); }} />
        </Modal>
      )}
    </div>
  );
}

function AddStudentForm({ initial, onSave, onCancel }) {
  const [name, setName] = useState(initial?.name || "");
  const [phone, setPhone] = useState(initial?.phone || "");
  const [note, setNote] = useState(initial?.note || "");
  return (
    <div className="flex flex-col gap-3.5">
      <Field label="Student name *"><input className="input w-full px-3 py-2.5 text-sm" value={name} onChange={(e) => setName(e.target.value)} autoFocus /></Field>
      <Field label="Phone / parent contact"><input className="input w-full px-3 py-2.5 text-sm" value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
      <Field label="Note"><input className="input w-full px-3 py-2.5 text-sm" value={note} onChange={(e) => setNote(e.target.value)} /></Field>
      <div className="flex justify-end gap-2 pt-1">
        <button className="btn btn-ghost px-4 py-2.5 text-sm" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary px-5 py-2.5 text-sm" disabled={!name.trim()} style={{ opacity: name.trim() ? 1 : 0.45 }} onClick={() => onSave({ name: name.trim(), phone: phone.trim(), note: note.trim() })}>{initial ? "Save changes" : "Save"}</button>
      </div>
    </div>
  );
}

function EditAttendanceForm({ entry, purchase, teachers, onSave, onCancel }) {
  const [units, setUnits] = useState(entry.unitsUsed);
  const [teacher, setTeacher] = useState(entry.teacher || "");
  const [attended, setAttended] = useState(entry.attended !== false);
  const [isBonus, setIsBonus] = useState(!!entry.isBonus);
  const [note, setNote] = useState(entry.note || "");
  const [date, setDate] = useState(entry.date);
  const unitName = purchase ? TYPE_CONFIG[purchase.type].unitName : "class";
  return (
    <div className="flex flex-col gap-3.5">
      <Field label="Date"><input type="date" className="input w-full px-3 py-2.5 text-sm fmono" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Field label={`Units used (${unitName})`}><input type="number" min="0" step="0.25" className="input w-full px-3 py-2.5 text-sm fmono" value={units} onChange={(e) => setUnits(Number(e.target.value))} /></Field>
      {teachers && teachers.length > 0 && (
        <Field label="Teacher">
          <select className="input w-full px-3 py-2.5 text-sm" value={teacher} onChange={(e) => setTeacher(e.target.value)}>
            <option value="">—</option>
            {teachers.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        </Field>
      )}
      <Field label="Note"><input className="input w-full px-3 py-2.5 text-sm" value={note} onChange={(e) => setNote(e.target.value)} /></Field>
      <label className="flex items-start gap-2 text-sm card p-3" style={{ background: attended ? "transparent" : "var(--amber-tint)", cursor: "pointer" }}>
        <input type="checkbox" checked={!attended} onChange={(e) => setAttended(!e.target.checked)} style={{ marginTop: 2 }} />
        <span style={{ color: attended ? "var(--ink-soft)" : "#5A4118" }}>Charged but did not attend</span>
      </label>
      {purchase && (purchase.bonusUnits || 0) > 0 && (
        <label className="flex items-start gap-2 text-sm card p-3" style={{ background: isBonus ? "var(--teal-tint)" : "transparent", cursor: "pointer" }}>
          <input type="checkbox" checked={isBonus} onChange={(e) => setIsBonus(e.target.checked)} style={{ marginTop: 2 }} />
          <span style={{ color: isBonus ? "var(--teal-dark)" : "var(--ink-soft)" }}>Bonus (free) class</span>
        </label>
      )}
      <div className="flex justify-end gap-2 pt-1">
        <button className="btn btn-ghost px-4 py-2.5 text-sm" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary px-5 py-2.5 text-sm" onClick={() => onSave({ date, unitsUsed: Number(units) || 0, teacher, attended, isBonus, note: note.trim() })}>Save changes</button>
      </div>
    </div>
  );
}

function RegistrationFeeForm({ onSave, onCancel }) {
  const [amount, setAmount] = useState(2500);
  const [status, setStatus] = useState("paid");
  const [date, setDate] = useState(todayStr());
  const [note, setNote] = useState("");
  const options = [
    { id: "paid", label: "Collected (kept, not usable as discount)", hint: "Standard — one-time fee, no future credit" },
    { id: "credit", label: "Collected, usable as credit next renewal", hint: "Can be applied as a discount on their next course purchase" },
    { id: "waived", label: "Waived (not charged)", hint: "e.g. already knew the family before enrolling" },
  ];
  return (
    <div className="flex flex-col gap-3.5">
      <Field label="Amount (THB)"><input type="number" min="0" className="input w-full px-3 py-2.5 text-sm fmono" value={amount} onChange={(e) => setAmount(e.target.value)} /></Field>
      <Field label="Status">
        <div className="flex flex-col gap-2">
          {options.map((o) => (
            <button key={o.id} type="button" onClick={() => setStatus(o.id)} className="flex flex-col items-start px-3 py-2.5 rounded-lg text-left text-sm" style={{ border: status === o.id ? "2px solid var(--teal)" : "1px solid var(--line)", background: status === o.id ? "var(--teal-tint)" : "transparent" }}>
              <span className="font-medium" style={{ color: "var(--ink)" }}>{o.label}</span>
              <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{o.hint}</span>
            </button>
          ))}
        </div>
      </Field>
      <Field label="Date"><input type="date" className="input w-full px-3 py-2.5 text-sm fmono" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Field label="Note (optional)"><input className="input w-full px-3 py-2.5 text-sm" value={note} onChange={(e) => setNote(e.target.value)} /></Field>
      <div className="flex justify-end gap-2 pt-1">
        <button className="btn btn-ghost px-4 py-2.5 text-sm" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary px-5 py-2.5 text-sm" onClick={() => onSave({ amount: Number(amount) || 0, status, date, note: note.trim(), creditUsedInPurchaseId: null })}>Save</button>

function StudentProfile({ student, students, setStudents, purchases, setPurchases, attendance, setAttendance, purchasesByStudent, usedUnitsByPurchase, remainingOf, setSelectedStudentId, subjects, setSubjects, teachers, registrationFees, setRegistrationFees }) {
  const [addingPurchase, setAddingPurchase] = useState(false);
  const [editingPurchase, setEditingPurchase] = useState(null);
  const [editingAttendance, setEditingAttendance] = useState(null);
  const [editing, setEditing] = useState(false);
  const [addingFee, setAddingFee] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const myPurchases = (purchasesByStudent[student.id] || []).slice().sort((a, b) => (b.purchaseDate || "").localeCompare(a.purchaseDate || ""));
  const myAttendance = attendance.filter((a) => a.studentId === student.id).sort((a, b) => b.date.localeCompare(a.date));
  const myFees = registrationFees.filter((r) => r.studentId === student.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const availableCredit = myFees.find((r) => r.status === "credit" && !r.creditUsedInPurchaseId);

  function deletePurchase(id) {
    setPurchases((prev) => prev.filter((p) => p.id !== id));
    setAttendance((prev) => prev.filter((a) => a.purchaseId !== id));
  }
  function updatePurchase(id, fields) {
    setPurchases((prev) => prev.map((p) => (p.id === id ? { ...p, ...fields } : p)));
  }
  function updateAttendance(id, fields) {
    setAttendance((prev) => prev.map((a) => (a.id === id ? { ...a, ...fields } : a)));
  }
  function deleteFee(id) {
    setRegistrationFees((prev) => prev.filter((r) => r.id !== id));
  }
  function studentNameOf(id) {
    return students.find((s) => s.id === id)?.name || "—";
  }
  function deleteStudent() {
    setPurchases((prev) =>
      prev
        .map((p) => ({ ...p, studentIds: (p.studentIds || [p.studentId]).filter((sid) => sid !== student.id) }))
        .filter((p) => (p.studentIds || []).length > 0)
    );
    setAttendance((prev) => prev.filter((a) => a.studentId !== student.id));
    setRegistrationFees((prev) => prev.filter((r) => r.studentId !== student.id));
    setStudents((prev) => prev.filter((s) => s.id !== student.id));
    setSelectedStudentId(null);
  }

  return (
    <div className="flex flex-col gap-4">
      <button className="flex items-center gap-1 text-sm font-medium w-fit" style={{ color: "var(--teal-dark)", background: "none", border: "none" }} onClick={() => setSelectedStudentId(null)}><ArrowLeft size={14} /> All students</button>

      <div className="card p-5 flex items-center justify-between flex-wrap gap-3">
        <div>
          <div className="fdisplay flex items-center gap-2" style={{ fontSize: 24, fontWeight: 700, color: "var(--ink)" }}>
            {student.name}
            <button className="p-1 rounded-full" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => setEditing(true)} title="Edit student"><Pencil size={16} /></button>
            <button className="p-1 rounded-full" style={{ color: "var(--coral)", background: "none", border: "none" }} onClick={() => setConfirmDelete(true)} title="Delete student"><Trash2 size={16} /></button>
          </div>
          {student.phone && <div className="text-sm fmono mt-1" style={{ color: "var(--ink-soft)" }}>{student.phone}</div>}
          {student.note && <div className="text-sm mt-1" style={{ color: "var(--ink-soft)" }}>{student.note}</div>}
        </div>
        <button className="btn btn-primary flex items-center gap-1.5 px-4 py-2.5 text-sm" onClick={() => setAddingPurchase(true)}><Plus size={17} /> Add package</button>
      </div>

      {confirmDelete && (
        <div className="card p-4 flex flex-wrap items-center justify-between gap-3" style={{ background: "var(--coral-tint)", border: "none" }}>
          <div className="text-sm" style={{ color: "var(--coral)" }}>
            Delete {student.name}? This removes their attendance history and registration fee records. Packages shared with a sibling stay intact for the sibling; packages only theirs are deleted too.
          </div>
          <div className="flex gap-2 shrink-0">
            <button className="btn btn-ghost px-3 py-2 text-sm" onClick={() => setConfirmDelete(false)}>Cancel</button>
            <button className="btn px-3 py-2 text-sm" style={{ background: "var(--coral)", color: "white" }} onClick={deleteStudent}>Delete</button>
          </div>
        </div>
      )}

      <div>
        <SectionTitle>Registration fee</SectionTitle>
        {myFees.length === 0 ? (
          <div className="card p-4 flex items-center justify-between gap-3">
            <div className="text-sm" style={{ color: "var(--ink-soft)" }}>No registration fee recorded for this student yet</div>
            <button className="btn btn-ghost px-3 py-2 text-sm shrink-0" onClick={() => setAddingFee(true)}>Add</button>
          </div>
        ) : (
          <div className="card p-4 flex flex-col gap-2.5">
            {myFees.map((r) => (
              <div key={r.id} className="flex items-center justify-between gap-3">
                <div className="text-sm">
                  <span className="font-medium" style={{ color: "var(--ink)" }}>{fmtBaht(r.amount)}</span>{" "}
                  <span
                    className="badge fmono"
                    style={{
                      background: r.status === "waived" ? "var(--teal-tint)" : r.status === "credit" ? "var(--amber-tint)" : "var(--coral-tint)",
                      color: r.status === "waived" ? "var(--teal-dark)" : r.status === "credit" ? "#92651A" : "var(--coral)",
                    }}
                  >
                    {r.status === "waived" ? "Waived" : r.status === "credit" ? (r.creditUsedInPurchaseId ? "Credit used" : "Credit available") : "Collected"}
                  </span>
                  <div className="text-xs mt-0.5" style={{ color: "var(--ink-soft)" }}>{fmtDate(r.date)}{r.note ? ` · ${r.note}` : ""}</div>
                </div>
                <button className="btn-danger p-1.5 shrink-0" onClick={() => deleteFee(r.id)}><Trash2 size={15} /></button>
              </div>
            ))}
            <button className="btn btn-ghost px-3 py-2 text-sm w-fit" onClick={() => setAddingFee(true)}>+ Add another</button>
          </div>
        )}
      </div>

      <div>
        <SectionTitle>Packages purchased</SectionTitle>
        {myPurchases.length === 0 ? <Empty icon={BookOpenCheck} title="No packages yet" sub="Add a package so this student can be checked in" /> : (
          <div className="flex flex-col gap-2.5">
            {myPurchases.map((p) => {
              const siblingNames = (p.studentIds || [p.studentId]).filter((sid) => sid !== student.id).map(studentNameOf);
              return <PurchaseCard key={p.id} p={p} remaining={remainingOf(p)} used={usedUnitsByPurchase[p.id] || 0} sharedWith={siblingNames} onEdit={() => setEditingPurchase(p)} onDelete={() => deletePurchase(p.id)} />;
            })}
          </div>
        )}
      </div>

      <div>
        <SectionTitle>Attendance history</SectionTitle>
        {myAttendance.length === 0 ? <div className="text-sm py-2" style={{ color: "var(--ink-soft)" }}>No history yet</div> : (
          <div className="card divide-y">
            {myAttendance.map((a) => {
              const p = purchases.find((x) => x.id === a.purchaseId);
              return (
                <div key={a.id} className="flex items-center justify-between px-4 py-2.5" style={a.attended === false ? { background: "var(--amber-tint)" } : {}}>
                  <div className="flex items-center gap-2 text-sm">
                    <span className="fmono" style={{ color: "var(--ink-soft)" }}>{fmtDate(a.date)}</span>
                    <span style={{ color: "var(--ink)" }}>{p?.subject || (a.isAdvance ? "Advance (no package)" : "—")}</span>
                    {a.teacher && <span className="text-xs" style={{ color: "var(--ink-soft)" }}>· {a.teacher}</span>}
                    {a.isBonus && <span className="text-xs" style={{ color: "var(--teal-dark)" }}>· bonus</span>}
                    {a.attended === false && <span className="text-xs" style={{ color: "#92651A" }}>· charged, absent</span>}
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs fmono" style={{ color: "var(--ink-soft)" }}>{fmtNum(a.unitsUsed)} {p ? TYPE_CONFIG[p.type].unitName : ""}{a.unitsUsed !== 1 ? "s" : ""}</span>
                    <button className="p-1" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={() => setEditingAttendance(a)} title="Edit"><Pencil size={13} /></button>
                    <button className="btn-danger p-1" onClick={() => setAttendance((prev) => prev.filter((x) => x.id !== a.id))} title="Delete"><Trash2 size={13} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {addingPurchase && (
        <Modal onClose={() => setAddingPurchase(false)} title={`Add package for ${student.name}`} wide>
          <AddPurchaseForm
            students={students}
            purchases={purchases}
            preselectedStudentId={student.id}
            allowSharing
            subjects={subjects} setSubjects={setSubjects}
            availableCredit={availableCredit}
            existingFeeStatus={myFees.length ? describeFeeStatus(myFees[0]) : null}
            onCancel={() => setAddingPurchase(false)}
            onSave={(purchase, creditApplied, feeInfo) => {
              const id = uid();
              setPurchases((prev) => [...prev, { ...purchase, id }]);
              if (creditApplied && availableCredit) {
                setRegistrationFees((prev) => prev.map((r) => (r.id === availableCredit.id ? { ...r, creditUsedInPurchaseId: id } : r)));
              }
              if (feeInfo) {
                setRegistrationFees((prev) => [...prev, { id: uid(), studentId: student.id, amount: feeInfo.amount, status: feeInfo.status, date: purchase.purchaseDate, note: "", creditUsedInPurchaseId: null }]);
              }
              setAttendance((prev) => prev.map((a) => (a.purchaseId === PENDING_PURCHASE_ID && purchase.studentIds.includes(a.studentId) ? { ...a, purchaseId: id } : a)));
              setAddingPurchase(false);
            }}
          />
        </Modal>
      )}

      {addingFee && (
        <Modal onClose={() => setAddingFee(false)} title={`Registration fee — ${student.name}`}>
          <RegistrationFeeForm
            onCancel={() => setAddingFee(false)}
            onSave={(fee) => {
              const id = uid();
              setRegistrationFees((prev) => [...prev, { ...fee, id, studentId: student.id }]);
              setAddingFee(false);
            }}
          />
        </Modal>
      )}

      {editingPurchase && (
        <Modal onClose={() => setEditingPurchase(null)} title={`Edit package — ${editingPurchase.subject}`} wide>
          <AddPurchaseForm
            students={students}
            purchases={purchases}
            allowSharing
            subjects={subjects} setSubjects={setSubjects}
            initial={editingPurchase}
            onCancel={() => setEditingPurchase(null)}
            onSave={(purchase) => {
              updatePurchase(editingPurchase.id, purchase);
              setEditingPurchase(null);
            }}
          />
        </Modal>
      )}

      {editingAttendance && (
        <Modal onClose={() => setEditingAttendance(null)} title="Edit check-in">
          <EditAttendanceForm
            entry={editingAttendance}
            purchase={purchases.find((p) => p.id === editingAttendance.purchaseId)}
            teachers={teachers}
            onCancel={() => setEditingAttendance(null)}
            onSave={(fields) => {
              updateAttendance(editingAttendance.id, fields);
              setEditingAttendance(null);
            }}
          />
        </Modal>
      )}

      {editingAttendance && (
        <Modal onClose={() => setEditingAttendance(null)} title="Edit check-in">
          <EditAttendanceForm
            entry={editingAttendance}
            purchase={purchases.find((p) => p.id === editingAttendance.purchaseId)}
            teachers={teachers}
            onCancel={() => setEditingAttendance(null)}
            onSave={(fields) => {
              updateAttendance(editingAttendance.id, fields);
              setEditingAttendance(null);
            }}
          />
        </Modal>
      )}

      {editing && (
        <Modal onClose={() => setEditing(false)} title="Edit student">
          <AddStudentForm
            initial={student}
            onCancel={() => setEditing(false)}
            onSave={(updated) => {
              setStudents((prev) => prev.map((s) => (s.id === student.id ? { ...s, ...updated } : s)));
              setEditing(false);
            }}
          />
        </Modal>
      )}
    </div>
  );
}

function PurchaseCard({ p, remaining, used, sharedWith, onEdit, onDelete }) {
  const cfg = TYPE_CONFIG[p.type];
  const cc = ccBreakdown(p);
  const bonus = p.bonusUnits || 0;
  const capacity = p.totalUnits + bonus;
  const discountAmt = p.discountAmount != null ? p.discountAmount : (p.discount || 0);
  const pct = Math.min(100, Math.round((used / capacity) * 100));
  return (
    <div className="card p-4">
      <div className="flex items-start justify-between gap-3">
        <div className="flex items-center gap-2.5">
          <div className="flex items-center justify-center rounded-lg shrink-0" style={{ width: 36, height: 36, background: "var(--teal-tint)", color: "var(--teal-dark)" }}><TypeIcon type={p.type} size={18} /></div>
          <div>
            <div className="font-semibold flex items-center gap-1.5" style={{ color: "var(--ink)" }}>
              {p.subject}
              {bonus > 0 && <span className="badge" style={{ background: "var(--amber-tint)", color: "#92651A" }}>+{fmtNum(bonus)} bonus</span>}
              {discountAmt > 0 && <span className="badge" style={{ background: "var(--coral-tint)", color: "var(--coral)" }}>-{p.discountType === "percent" ? `${fmtNum(p.discountValue)}%` : fmtBaht(discountAmt)} off</span>}
            </div>
            <div className="text-xs" style={{ color: "var(--ink-soft)" }}>
              {cfg.label} · purchased {fmtDate(p.purchaseDate)}
              {sharedWith && sharedWith.length > 0 && <> · shared with {sharedWith.join(", ")}</>}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          {onEdit && <button className="p-1.5" style={{ color: "var(--ink-soft)", background: "none", border: "none" }} onClick={onEdit} title="Edit this package"><Pencil size={15} /></button>}
          <button className="btn-danger p-1.5" onClick={onDelete} title="Delete this package"><Trash2 size={15} /></button>
        </div>
      </div>
      <div className="mt-3">
        <div className="h-2 rounded-full overflow-hidden" style={{ background: "var(--teal-tint)" }}>
          <div className="h-full rounded-full" style={{ width: `${pct}%`, background: remaining === 0 ? "var(--coral)" : "var(--teal)" }} />
        </div>
        <div className="flex items-center justify-between mt-1.5">
          <span className="text-xs fmono" style={{ color: "var(--ink-soft)" }}>Used {fmtNum(used)}/{fmtNum(capacity)} {cfg.unitName}{capacity !== 1 ? "s" : ""}</span>
          <RemainingBadge remaining={remaining} total={capacity} unitName={cfg.unitName} />
        </div>
      </div>
      <div className="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3 pt-3 text-xs fmono" style={{ borderTop: "1px solid var(--line)", color: "var(--ink-soft)" }}>
        <span>Paid {fmtBaht(p.pricePaid)}{discountAmt > 0 ? ` (full ${fmtBaht(p.listPrice != null ? p.listPrice : p.pricePaid)})` : ""}</span>
        <span>· per {cfg.unitName} {fmtBaht(netPricePerUnit(p))}</span>
        <span className="flex items-center gap-1">{p.paymentMethod === "credit" ? <CreditCard size={12} /> : <Wallet size={12} />} {p.paymentMethod === "credit" ? "Credit card" : "Cash"}</span>
        {p.paymentMethod === "credit" && (
          cc.chargeExtra
            ? <span>· +3% charged to customer ({fmtBaht(cc.customerCharged)} total)</span>
            : <span>· 3% fee absorbed by school (-{fmtBaht(cc.feeCost)}, net {fmtBaht(cc.netRevenue)})</span>
        )}
      </div>
    </div>
  );
}
